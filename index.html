function mdKey(d){return (d.getMonth()+1)+"-"+d.getDate();}
function todaysSaints(){return FEASTS[mdKey(new Date())]||[];}
function nextFeast(){const d=new Date(); for(let i=1;i<=366;i++){d.setDate(d.getDate()+1); const f=FEASTS[mdKey(d)]; if(f) return {saints:f,date:new Date(d)};} return null;}

function seeded(str){let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return((h>>>0)%10000)/10000;};}
function daily(){
  const t=dayKey();
  if(!st.daily||st.daily.day!==t){
    const rnd=seeded(t); let pool=["open5","open10","rare","new2","counter2","read3"];
    const list=["boss"]; if(todaysSaints().length) list.push("feast");
    while(list.length<3){const i=Math.floor(rnd()*pool.length); list.push(pool.splice(i,1)[0]);}
    st.daily={day:t,list,claimed:[],bonus:false,opened:0,rareGot:0,newGot:0,counterHits:0,views:[],feastOpened:0,defeated:0}; save();
  }
  return st.daily;
}
function prog(id){const d=daily(), D=DEFIS[id]; const v=D.k==="views"?d.views.length:d[D.k]; return Math.min(v,D.n);}
function done(id){return prog(id)>=DEFIS[id].n;}
function rwText(rw){return rw.blessed?`${rw.blessed} paquet${rw.blessed>1?"s":""} béni${rw.blessed>1?"s":""}`:`${rw.packs} paquet${rw.packs>1?"s":""}`;}
function give(rw){if(rw.packs) st.packs+=rw.packs; if(rw.blessed) st.blessed+=rw.blessed; SFX.reward();}
function track(k,n=1){const d=daily(); d[k]=(d[k]||0)+n; save(); renderDot();}
function trackView(id){const d=daily(); if(!d.views.includes(id)){d.views.push(id); save(); renderDot();}}
function claimable(){const d=daily(); return d.list.some(id=>done(id)&&!d.claimed.includes(id))||(d.list.every(id=>d.claimed.includes(id))&&!d.bonus);}
function renderDot(){$("defiDot").classList.toggle("hidden",!claimable()||curTab()==="packs");}

  const h=document.createElement("h4"); h.className="evh"; h.textContent="Défis du jour"; h.style.marginTop="1.2rem"; box.appendChild(h);
  const readyD=d.list.filter(id=>done(id)&&!d.claimed.includes(id)); const bonusReady=!d.bonus&&d.list.every(id=>d.claimed.includes(id)||readyD.includes(id));
  if(readyD.length+(bonusReady?1:0)>1){ const b=document.createElement("button"); b.className="btn claimall"; b.textContent=`Tout récupérer (${readyD.length+(bonusReady?1:0)})`;
    b.onclick=()=>{ readyD.forEach(id=>{ d.claimed.push(id); const r=DEFIS[id].rw; if(r.packs) st.packs+=r.packs; if(r.blessed) st.blessed+=r.blessed; });

  d.list.forEach(id=>{
    const D=DEFIS[id], p=prog(id), cl=d.claimed.includes(id);
    const bar=document.createElement("div"); bar.className="minibar"; bar.innerHTML=`<span style="width:${p/D.n*100}%"></span>`;
    const r=evRow("d"+(cl?" claimed":""),cl?"✓":`${p}/${D.n}`,D.t,"Récompense : "+rwText(D.rw),cl?"Reçu ✓":(p>=D.n?"Récupérer":null),()=>{d.claimed.push(id); give(D.rw); save(); renderAll();},cl,cl?null:bar);
    box.appendChild(r);
  });
  const all=d.list.every(id=>d.claimed.includes(id));
  box.appendChild(evRow("d bonusd"+(d.bonus?" claimed":""),"✦","Bonus : les trois défis","Récompense : 1 paquet béni",d.bonus?"Reçu ✓":(all?"Récupérer":null),()=>{d.bonus=true; give({blessed:1}); save(); renderAll();},d.bonus));
}

function grandeFete(d=new Date()){

    const doc=await fbDb.collection("saves").doc(cloudUser.uid).get();

    const cloud=doc.data(), cs=cloud.state||{};

function bell(freq,t0=0,vol=.22,dur=3.2){
  const a=ac(); if(!a) return; const now=a.currentTime+t0;
  const out=a.createGain(); out.gain.value=vol; out.connect(a.bus);
  [[.5,.35,1],[1,1,.85],[1.19,.45,.7],[1.5,.3,.6],[2,.55,.5],[2.51,.22,.35],[3.01,.16,.25],[4.1,.08,.15]].forEach(([m,amp,dk])=>{
    const o=a.createOscillator(), g=a.createGain(); o.type="sine"; o.frequency.value=freq*m;
    g.gain.setValueAtTime(0.0001,now); g.gain.exponentialRampToValueAtTime(amp,now+.006); g.gain.exponentialRampToValueAtTime(.0001,now+dur*dk);
    o.connect(g); g.connect(out); o.start(now); o.stop(now+dur*dk+.05);
  });
}

  o.type="triangle"; o.frequency.setValueAtTime(900,now); o.frequency.exponentialRampToValueAtTime(420,now+.08);
  g.gain.setValueAtTime(.08,now); g.gain.exponentialRampToValueAtTime(.0001,now+.1); o.connect(g); g.connect(a.bus); o.start(now); o.stop(now+.12); }

function rollRarity(forceRare){
  const pool=forceRare?["R","TR"]:RORDER;
  const tot=pool.reduce((a,k)=>a+RAR[k].w,0); let x=Math.random()*tot;
  for(const k of pool){x-=RAR[k].w; if(x<=0) return k;} return pool[pool.length-1];
}
function pickSaint(r,ex=[]){let list=S.filter(s=>s.r===r&&!ex.includes(s.id)); if(!list.length) list=S.filter(s=>!ex.includes(s.id)); return list[Math.floor(Math.random()*list.length)];}
const GR={C:5,PC:10,R:25,TR:60,L:150};      // grâces reçues pour un doublon
const COST={C:60,PC:120,R:300,TR:750,L:2000}; // grâces pour obtenir un saint
const RCOST={C:40,PC:80,R:200,TR:500,L:1200}; // grâces pour la relique d'un saint possédé
const RELDROP=0.03, RELFEAST=0.3, RELBONUS=1.5;
const hasRel=id=>st.reliques.includes(id);
function addRel(id){ if(!hasRel(id)) st.reliques.push(id); }
function gain(s){const isNew=!st.owned[s.id]; let gr=0, rel=false;
  if(s.id==="augustin"){const d=new Date(); if(d.getMonth()===7&&d.getDate()===28) st.secret.tolle=true;}
  if(isNew) st.owned[s.id]=1;
  else if(!hasRel(s.id)&&Math.random()<RELDROP){ addRel(s.id); rel=true; }
  else {gr=GR[s.r]; st.graces+=gr;}
  return {s,isNew,gr,rel};}
function openPack(){
  regen(); if(st.packs<=0) return;
  st.packs--; if(st.packs===MAXP-1) st.last=Date.now();
  const force=st.dry>=PITY, forceL=st.dryL>=PITYL-1; const cards=[]; let gotRare=false, gotL=false;
  for(let i=0;i<3;i++){
    let r=rollRarity(force&&i===2&&!gotRare);
    if(forceL&&i===2&&!gotL) r="L";
    const ex=cards.map(c=>c.s.id);
    let s=pickSaint(r,ex); r=s.r;
    const fsd=todaysSaints().filter(x=>!ex.includes(x.id)); if(!(forceL&&i===2&&!gotL)&&fsd.length&&Math.random()<RATEUP){s=fsd[Math.floor(Math.random()*fsd.length)]; r=s.r;}
    if(["R","TR","L"].includes(r)) gotRare=true; if(r==="L") gotL=true;
    cards.push(gain(s));
  }
  st.dry=gotRare?0:st.dry+1; st.dryL=gotL?0:st.dryL+1; save();
  track("opened"); const nr=cards.filter(c=>["R","TR","L"].includes(c.s.r)).length, nn=cards.filter(c=>c.isNew).length;
  if(nr) track("rareGot",nr); if(nn) track("newGot",nn);
  showReveal(cards);
}
function openFeastPack(){
  const fs=todaysSaints(); if(!fs.length||st.feast===dayKey()) return;
  st.feast=dayKey();
  const cards=[]; const add=s=>cards.push(gain(s)); const ex=()=>cards.map(c=>c.s.id);
  add(fs[Math.floor(Math.random()*fs.length)]);
  if(!cards[0].rel&&!hasRel(cards[0].s.id)&&Math.random()<RELFEAST){ addRel(cards[0].s.id); cards[0].rel=true; if(cards[0].gr){st.graces-=cards[0].gr; cards[0].gr=0;} }
  add(pickSaint(rollRarity(true),ex()));
  add(pickSaint(rollRarity(false),ex()));
  st.feastCount++; save(); track("feastOpened"); const nr=cards.filter(c=>["R","TR","L"].includes(c.s.r)).length, nn=cards.filter(c=>c.isNew).length;
  if(nr) track("rareGot",nr); if(nn) track("newGot",nn);
  showReveal(cards,true);
}
let revealSeq=0;
function showReveal(cards,feast){
  const my=++revealSeq;
  {const d=new Date(); if(d.getMonth()===11&&((d.getDate()===24&&d.getHours()>=22)||(d.getDate()===25&&d.getHours()<3))){ st.secret.minuit=true; save(); }}
  SFX.pack();
  if(!feast) packOpenFx();
  else window.scrollTo({top:$("reveal").offsetTop-120,behavior:"smooth"});
  const rv=$("reveal"); rv.innerHTML=""; let flipped=0;
  $("revealHint").textContent="Touche les cartes pour les retourner";
  setTimeout(()=>{
    if(my!==revealSeq) return; // un autre paquet a été ouvert entre-temps
    cards.forEach((c,i)=>{
      const back=backEl(); back.classList.remove("pop"); back.classList.add("flyin"); back.style.animationDelay=(i*.13)+"s"; back.style.setProperty("--fr",((i-1)*18)+"deg");
      if(c.s.r==="L") back.classList.add("glowL"); else if(c.s.r==="TR") back.classList.add("glowTR");
      back.onclick=()=>{const el=cardEl(c.s,{isNew:c.isNew,gr:c.gr,rel:c.rel}); el.classList.add("flip"); back.replaceWith(el); (SFX.flip[c.s.r]||clickSnd)(); if(c.rel) SFX.reward();
        if(c.s.r==="L") setTimeout(()=>legendFx(c.s),250);
        else if(c.s.r==="TR"&&!RM){const tb=document.createElement("span"); tb.className="trburst"; el.appendChild(tb); setTimeout(()=>tb.remove(),1000);}
        flipped++; if(flipped===3) $("revealHint").textContent=cards.some(x=>x.isNew)?"Nouveaux saints dans ta collection !":"Déjà dans ta collection.";};
      rv.appendChild(back);
    });
  },RM?100:650);
  renderAll();
}

/* ------------ RENDU ------------ */
function cardEl(s,o={}){
  const b=document.createElement(o.div?"div":"button"); if(!o.div) b.type="button"; b.className="card "+s.r;
  b.innerHTML=`<div class="fr"><div class="arch"><div class="rays"></div><span class="emb"></span></div><div class="nm"></div><div class="sub"></div><div class="foot"><span class="vt"></span><span class="gems"></span></div></div>`;
  b.querySelector(".emb").textContent=initials(s.n); b.dataset.id=s.id; if(IMG[s.id]) setImg(b,s.id);
  const sh=document.createElement("span"); sh.className="sheen"; b.appendChild(sh);
  b.querySelector(".nm").textContent=short(s);
  b.querySelector(".sub").textContent=s.cat+" · "+shortFeast(s.f);
  b.querySelector(".vt").textContent=s.vt;
  b.querySelector(".gems").textContent="◆".repeat(GEMS[s.r]);
  b.setAttribute("aria-label",`${s.n}, ${RAR[s.r].n}, vertu ${s.vt}`);
  if(o.isNew){const n=document.createElement("span");n.className="new";n.textContent="Nouveau";b.appendChild(n);}
  if(o.gr){const n=document.createElement("span");n.className="new grace";n.textContent="+"+o.gr+" grâces";b.appendChild(n);}
  if(o.rel){const n=document.createElement("span");n.className="new relb";n.textContent="Relique !";b.appendChild(n);}
  if(st.patron===s.id){const pt=document.createElement("span");pt.className="patb";pt.textContent="♥ Patron";b.appendChild(pt);}
  if(!o.locked&&hasRel(s.id)){const r=document.createElement("span");r.className="relm";r.title="Relique";r.setAttribute("aria-label","Relique");r.textContent="✚";b.appendChild(r);}
  if(o.dup&&o.dup>1){const d=document.createElement("span");d.className="dup";d.textContent="×"+o.dup;b.appendChild(d);}
  if(!o.noOpen&&!o.div) b.onclick=()=>openDetail(s);
  return b;
}
function lockedEl(){const d=document.createElement("div");d.className="card locked";d.innerHTML='<div class="fr"><div class="arch"><span class="emb">?</span></div><div class="nm">À découvrir</div></div>';return d;}
function backEl(){const b=document.createElement("button");b.type="button";b.className="back pop";b.setAttribute("aria-label","Retourner la carte");
  b.innerHTML='<svg viewBox="0 0 22 30" aria-hidden="true"><path d="M9 0h4v8h9v4h-9v18H9V12H0V8h9z" fill="currentColor"/></svg>';return b;}
function openDetail(s){
  trackView(s.id);
  const sh=$("sheet"); sh.innerHTML="";
  const big=document.createElement("div"); big.className="bigcard"; big.appendChild(cardEl(s,{div:true}));
  const h=document.createElement("h2"); h.textContent=s.n; sh.appendChild(big);
  const m=document.createElement("div"); m.className="meta"; m.textContent=`${s.cat} · fête le ${s.f}`;
  const tr=document.createElement("div"); tr.className="tagrow";
  [RAR[s.r].n,"Vertu : "+s.vt].forEach(t=>{const x=document.createElement("span");x.className="tag";x.textContent=t;tr.appendChild(x);});
  const l=document.createElement("p"); l.textContent=s.l;
  const p=document.createElement("p"); p.className="muted"; p.textContent=s.p;
  sh.append(h,m,tr,l,p);
  if(s.q){const q=document.createElement("p");q.className="quote";q.textContent=s.q;sh.appendChild(q);}
  const pr=document.createElement("p"); pr.innerHTML=`<em>${s.n}, priez pour nous.</em>`; pr.className="muted";
  const c=document.createElement("button"); c.className="btn ghost"; c.textContent="Fermer"; c.onclick=closeModal;
  if(st.owned[s.id]){
    const rb=document.createElement("div"); rb.className="relbox";
    const rt=document.createElement("div"); rt.className="rt"; const rd=document.createElement("div"); rd.className="rd";
    if(hasRel(s.id)){ rt.textContent="✚ Relique de "+lc(s.n); rd.textContent="Tu possèdes sa relique : ce saint frappe 1,5 fois plus fort en combat, pour toujours."; rb.append(rt,rd); }
    else {
      rt.textContent="Relique de "+lc(s.n); rd.textContent=`Pas encore dans ton reliquaire. On la trouve parfois en tirant ce saint en double, souvent le jour de sa fête, ou avec des grâces (✦ ${RCOST[s.r]}). Elle le rend 1,5 fois plus fort en combat.`;
      const bb=document.createElement("button"); bb.className="btn"; bb.textContent=`Obtenir la relique · ✦ ${RCOST[s.r]}`; bb.disabled=st.graces<RCOST[s.r];
      bb.onclick=()=>{ if(st.graces<RCOST[s.r]) return; st.graces-=RCOST[s.r]; addRel(s.id); save(); renderAll(); openDetail(s); };
      rb.append(rt,rd,bb);
    }
    sh.appendChild(rb);
  }
  sh.append(pr,c); $("modal").classList.remove("hidden"); c.focus();
}
function closeModal(){$("modal").classList.add("hidden");}
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});

let filter="Tous";
function renderCollection(){ if(!$("tab-collection").classList.contains("hidden")) renderAch(); }
function renderPacks(){
  regen(); $("packCount").textContent=st.packs>=MAXP?`${st.packs} paquet${st.packs>1?"s":""}`:`${st.packs} / ${MAXP} paquets`;
  $("packBtn").disabled=st.packs<=0;
  const bb=$("blessedBtn"); bb.classList.toggle("hidden",st.blessed<=0); bb.textContent=`✦ Paquet béni${st.blessed>1?" ×"+st.blessed:""}`;
}
function tick(){
  regen();
  if(st.packs<MAXP){const left=REGEN-(Date.now()-st.last);const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);
    $("packTimer").textContent=`Prochain paquet dans ${m}:${String(s).padStart(2,"0")}`;}
  else $("packTimer").textContent="Paquets pleins";
  renderPacks();
}
/* ------------ COMBAT ------------ */
const BOSS_HP=150, MAXATK=3, COUNTER=3; let combatAll=false;
function vice(){return VICES[new Date().getDay()];}
function isFeast(s){return todaysSaints().some(x=>x.id===s.id);}
function isCounter(s){return s.vt===vice().c;}
function damage(s){return Math.round(RAR[s.r].dmg*(isCounter(s)?COUNTER:1)*(isFeast(s)?3:1)*(hasRel(s.id)?RELBONUS:1)*(st.patron===s.id?1.5:1));}
function renderCombat(){
  const t=dayKey(); if(st.boss.day!==t||typeof st.boss.hp!=="number"||!Array.isArray(st.boss.used)){st.boss={day:t,hp:BOSS_HP,used:[]};save();}
  const v=vice();
  $("bossName").textContent=v.v;
  $("bossCounter").textContent=`Vertu contraire : ${v.c}. Les saints de cette vertu frappent trois fois plus fort.`;
  $("hpBar").style.width=(st.boss.hp/BOSS_HP*100)+"%"; $("hpText").textContent=st.boss.hp>0?`${st.boss.hp} / ${BOSS_HP}`:"Vaincu !";
  const area=$("combatArea"); area.innerHTML="";
  const left=MAXATK-st.boss.used.length;
  const info=document.createElement("p"); info.className="center muted";
  info.textContent=st.boss.hp<=0?"":(left>0?`Tu peux envoyer encore ${left} saint${left>1?"s":""} aujourd'hui. Choisis bien !`:"Tu as envoyé tes 3 saints. Reviens demain !");
  area.appendChild(info);
  if(st.boss.hp<=0){const d=document.createElement("p");d.className="done";d.textContent=`${v.v} est vaincu pour aujourd'hui. Deo gratias !`;area.appendChild(d);}
  const lg=document.createElement("p"); lg.className="center"; lg.id="log"; lg.textContent=lastLog; area.appendChild(lg);
  const mine=S.filter(x=>st.owned[x.id]);
  if(!mine.length){const m=document.createElement("p");m.className="center muted";m.textContent="Ouvre d'abord un paquet pour recruter tes premiers saints.";area.appendChild(m);return;}
  const grid=document.createElement("div"); grid.className="pickgrid";
  mine.sort((a,b)=>damage(b)-damage(a)||RORDER.indexOf(a.r)-RORDER.indexOf(b.r));
  const shown=combatAll?mine:mine.slice(0,6);
  const sub=document.createElement("p"); sub.className="center muted"; sub.textContent=combatAll?"Tous tes saints, du plus efficace au moins efficace :":"Tes 6 saints les plus efficaces aujourd'hui :"; area.appendChild(sub);
  shown.forEach(x=>{
    const c=cardEl(x,{noOpen:true}); const used=st.boss.used.includes(x.id);
    const dg=document.createElement("div"); dg.className="dmg"; dg.textContent=`−${damage(x)}`; c.appendChild(dg);
    if(isCounter(x)){const bb=document.createElement("div");bb.className="bonus";bb.textContent="×3";c.appendChild(bb);}
    if(isFeast(x)){const f=document.createElement("div");f.className="feastb";f.textContent="Fête ×3";c.appendChild(f);}
    if(used||st.boss.hp<=0||left<=0) c.classList.add("used"); else c.onclick=()=>attack(x);
    grid.appendChild(c);
  });
  area.appendChild(grid);
  if(mine.length>6){ const mb=document.createElement("div"); mb.className="actions"; const bt=document.createElement("button"); bt.className="btn ghost";
    bt.textContent=combatAll?"Voir seulement les 6 meilleurs":`Voir tous mes saints (${mine.length})`; bt.onclick=()=>{combatAll=!combatAll; renderCombat();}; mb.appendChild(bt); area.appendChild(mb); }
}
let lastLog="";
function attack(x){
  const v=vice(); const d=damage(x);
  st.boss.hp=Math.max(0,st.boss.hp-d); st.boss.used.push(x.id); if(isCounter(x)) track("counterHits");
  hitFx(d,isCounter(x)||isFeast(x));
  lastLog=`${x.n} combat ${v.v.toLowerCase()} : −${d}${isCounter(x)?" — sa "+x.vt.toLowerCase()+" est redoutable !":""}${isFeast(x)?" (jour de sa fête !)":""}`;
  if(st.boss.hp===0){st.packs+=3; track("defeated"); if(v.v==="Orgueil"&&st.boss.used.includes("michel")) st.secret.quis=true; if(!st.vices.includes(v.v)) st.vices.push(v.v); lastLog=`${v.v} est vaincu ! +3 paquets. Deo gratias !`; SFX.victory();}
  save(); renderAll();
}
function curTab(){ const b=document.querySelector('nav button[aria-selected="true"]'); return b?b.dataset.tab:"packs"; }
function renderAll(){
  setTimeout(()=>{try{checkToasts();}catch(e){}},60);
  renderSnd(); cloudState(); renderDot();
  $("achDot").classList.toggle("hidden",!achClaimable());
  $("progress").textContent=`${Object.keys(st.owned).length}/${S.length}`;
  const t=curTab();
  if(t==="packs"){ renderPacks(); renderFeast(); }
  else if(t==="collection") renderAch();
  else if(t==="combat") renderCombat();
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected",x===b));
  ["packs","collection","combat"].forEach(t=>$("tab-"+t).classList.toggle("hidden",t!==b.dataset.tab));
  window.scrollTo(0,0); renderAll();
});
$("packBtn").onclick=openPack;
$("setBtn").onclick=openSettings;
$("oddsLink").onclick=openOdds;
$("blessedBtn").onclick=openBlessed;
$("subAch").onclick=()=>{achView=true;renderAch();};
$("subAl").onclick=()=>{achView=false;renderAch();};
$("thoughtBtn").onclick=showThought;
$("helpBtn").onclick=()=>showIntro(false);
renderAll(); tick(); setInterval(tick,1000); loadImages(); initCloud();
if(!st.seenIntro){ const hadPlayed=Object.keys(st.owned).length>0; if(hadPlayed){ st.seenIntro=true; save(); maybeThought(); } else setTimeout(()=>showIntro(true),300); } else maybeThought();
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
</script>
