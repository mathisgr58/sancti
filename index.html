<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sancti — collection des saints</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F4; --surface:#FFFFFF; --ink:#1B2230; --muted:#667085; --line:#D5DAE3; --accent:#6B1F2A; --accent-ink:#FFFFFF;
  --c:#7C8595; --pc:#3E8A6A; --r:#2F5FA8; --tr:#6E3FA3; --l:#B8860B;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#11151D; --surface:#1A202B; --ink:#E6E9EF; --muted:#9AA3B2; --line:#2B3342; --accent:#C9737F; --accent-ink:#11151D;
    --c:#98A1B0; --pc:#6DBE98; --r:#79A6E8; --tr:#B290E0; --l:#E5B94C; }
}
:root[data-theme="dark"]{ --bg:#11151D; --surface:#1A202B; --ink:#E6E9EF; --muted:#9AA3B2; --line:#2B3342; --accent:#C9737F; --accent-ink:#11151D;
  --c:#98A1B0; --pc:#6DBE98; --r:#79A6E8; --tr:#B290E0; --l:#E5B94C; }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Crimson Pro",Georgia,serif;font-size:1.08rem;line-height:1.45;-webkit-font-smoothing:antialiased}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{max-width:40rem;margin:0 auto;padding:.8rem 1rem .5rem;display:flex;align-items:baseline;justify-content:space-between;gap:1rem}
h1{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:1.5rem;letter-spacing:.06em;margin:0}
.progress{font-size:.95rem;color:var(--muted)}
nav{max-width:40rem;margin:0 auto;display:flex;padding:0 .5rem}
nav button{flex:1;font:inherit;font-size:1rem;background:none;border:none;border-bottom:3px solid transparent;padding:.55rem .3rem;color:var(--muted);cursor:pointer}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{max-width:40rem;margin:0 auto;padding:1.2rem 1rem 3rem}
.hidden{display:none!important}
.btn{font:inherit;cursor:pointer;border-radius:999px;padding:.7rem 1.4rem;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--accent)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.feast{text-align:center;border-radius:16px;padding:1rem;margin-bottom:.4rem;color:#F6E7BD;
  background:radial-gradient(ellipse at 50% 0%,#B8862F 0%,#7A2230 60%,#4A111B 100%);box-shadow:inset 0 0 0 2px #C9A24A}
.feast.grand{background:radial-gradient(ellipse at 50% 0%,#F4E2A6 0%,#D9A93E 40%,#8A5A12 100%);color:#2E1A06;box-shadow:inset 0 0 0 2px #FFF1C2,0 6px 20px rgba(185,135,40,.35);margin-bottom:.6rem}
.feast.grand .feastbtn{background:#5E1622;border-color:#5E1622;color:#F6E7BD}
.feast.grand .feastbtn:disabled{background:transparent;color:#2E1A06;border-color:rgba(46,26,6,.4)}
.feast.quiet{background:var(--surface);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.feast .fk{font-size:.95rem;font-style:italic;opacity:.9}
.feast .fn{font-family:Cinzel,serif;font-weight:700;font-size:1.25rem;margin:.2rem 0}
.feast .fi{font-size:.95rem;margin-bottom:.2rem}
.feast .feastbtn{margin-top:.6rem;background:#E9C46A;border-color:#E9C46A;color:#4A111B}
.feast .feastbtn:disabled{background:transparent;color:#F6E7BD;border-color:rgba(246,231,189,.5);opacity:.8}
.card .feastb{position:absolute;bottom:-.45rem;left:50%;transform:translateX(-50%);z-index:2;background:#B8862F;color:#fff;font-size:.66rem;font-weight:700;border-radius:999px;padding:.1rem .5rem;white-space:nowrap;box-shadow:0 2px 4px rgba(0,0,0,.3)}
/* Pack */
.packzone{text-align:center}
.pack{position:relative;width:12.5rem;height:17rem;margin:1rem auto;border-radius:16px;border:none;cursor:pointer;color:#F3DFA2;overflow:hidden;
  background:
    repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 10px,transparent 10px 20px),
    radial-gradient(ellipse at 50% 30%,#9B2F3E 0%,#5E1622 65%,#3E0D16 100%);
  box-shadow:0 14px 34px rgba(0,0,0,.35), inset 0 0 0 3px #C9A24A, inset 0 0 0 7px #5E1622, inset 0 0 0 8px rgba(201,162,74,.6);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;font-family:Cinzel,serif;transition:transform .15s}
.pack::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.18) 45%,transparent 60%);transform:translateX(-100%);animation:shine 3.5s ease-in-out infinite}
@keyframes shine{0%,60%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.pack .seal{width:4.6rem;height:4.6rem;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 30%,#E0B85A,#A67C1F 70%);box-shadow:0 3px 8px rgba(0,0,0,.4), inset 0 0 0 3px rgba(255,255,255,.25);color:#5E1622}
.pack .seal svg{width:1.8rem;height:2.4rem}
.pack .t{font-size:1.45rem;letter-spacing:.18em;font-weight:700;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.pack .s{font-family:"Crimson Pro",serif;font-size:.95rem;opacity:.85;font-style:italic}
.pack .orn{font-size:.9rem;letter-spacing:.4em;opacity:.7}
.pack:disabled{filter:grayscale(.85);opacity:.55;cursor:default}
.pack:disabled::before{animation:none}
.pack.shake{animation:shake .5s ease}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
.count{font-size:1.1rem;margin:.3rem 0}
.timer{color:var(--muted);font-size:.95rem;min-height:1.4em}
.reveal{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-top:1.2rem;perspective:800px}
.revealhint{text-align:center;color:var(--muted);font-style:italic;min-height:1.4em;margin-top:.6rem}
/* Card (image pieuse) */
.card{--rc:#8A8F99;position:relative;aspect-ratio:5/7.4;border-radius:12px;padding:5px;border:none;cursor:pointer;font:inherit;color:#2A2016;text-align:center;
  background:linear-gradient(145deg,color-mix(in srgb,var(--rc) 85%,#fff),var(--rc) 45%,color-mix(in srgb,var(--rc) 70%,#000));box-shadow:0 4px 12px rgba(0,0,0,.18)}
.card .fr{height:100%;border-radius:8px;background:
  radial-gradient(ellipse at 50% 0%,#FFF9EC 0%,#F4E8CF 55%,#E9D8B4 100%);display:flex;flex-direction:column;align-items:center;padding:.35rem .3rem .3rem;overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(120,90,40,.35)}
.card .arch{position:relative;width:86%;flex:1 1 auto;min-height:0;border-radius:999px 999px 6px 6px;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--rc) 35%,#FFF6DD) 0%,color-mix(in srgb,var(--rc) 60%,#3A2A12) 100%);
  box-shadow:inset 0 0 0 2px rgba(201,162,74,.9), inset 0 0 18px rgba(0,0,0,.25)}
.card .arch::before{content:"";position:absolute;width:62%;aspect-ratio:1;border-radius:50%;top:14%;
  background:radial-gradient(circle,rgba(255,236,170,.95) 0%,rgba(255,220,120,.35) 55%,transparent 70%)}
.card .rays{position:absolute;inset:-30%;background:repeating-conic-gradient(from 0deg at 50% 45%,rgba(255,240,190,.18) 0 6deg,transparent 6deg 18deg)}
.card .emb{position:relative;font-family:Cinzel,serif;font-weight:700;font-size:clamp(1.8rem,9vw,2.6rem);line-height:1;color:#FFF3D0;text-shadow:0 2px 4px rgba(0,0,0,.45)}
.card .arch img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;opacity:0;transition:opacity .4s}
.card .arch.hasimg img{opacity:1}
.card .arch.hasimg .emb,.card .arch.hasimg .rays{display:none}
.card .arch.hasimg::before{display:none}
.card .nm{font-family:Cinzel,serif;font-weight:700;font-size:.72rem;line-height:1.15;margin-top:.35rem;letter-spacing:.02em;min-height:1.7em;display:flex;align-items:center}
.card .sub{font-size:.7rem;color:#6B5A40;line-height:1.1}
.card .foot{display:flex;justify-content:space-between;align-items:center;width:100%;padding:.2rem .15rem 0;font-size:.66rem;color:#5A4A33;border-top:1px solid rgba(120,90,40,.25);margin-top:.2rem}
.card .gems{color:var(--rc);letter-spacing:-.05em;font-size:.72rem;filter:brightness(.8)}
.card.C{--rc:#9A8A74}
.card.PC{--rc:#3E8A6A}
.card.R{--rc:#2F5FA8}
.card.TR{--rc:#7A45B0}
.card.L{--rc:#C9A24A}
.card.L::after,.card.TR::after{content:"";position:absolute;inset:0;border-radius:12px;pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.45) 47%,transparent 62%);background-size:250% 100%;animation:foil 3s linear infinite;mix-blend-mode:overlay}
@keyframes foil{from{background-position:120% 0}to{background-position:-120% 0}}
.card .new{position:absolute;top:-.45rem;right:-.3rem;background:#8A2A36;color:#fff;font-size:.66rem;border-radius:999px;padding:.1rem .45rem;font-weight:600;z-index:2;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.card .dup{position:absolute;top:.5rem;left:.55rem;font-size:.68rem;color:#fff;background:rgba(0,0,0,.45);border-radius:999px;padding:0 .35rem;z-index:2}
.card.locked{cursor:default;--rc:var(--line);background:var(--line)}
.card.locked .fr{background:var(--surface);opacity:.7}
.card.locked .arch{background:var(--bg);box-shadow:inset 0 0 0 2px var(--line)}
.card.locked .arch::before{display:none}
.card.locked .emb{color:var(--muted);font-family:Cinzel,serif;font-size:1.8rem;filter:none}
.card.locked .nm{color:var(--muted)}
/* dos de carte */
.back{aspect-ratio:5/7.4;border-radius:12px;border:none;cursor:pointer;color:#E7C66B;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 8px,transparent 8px 16px),radial-gradient(ellipse at 50% 40%,#8A2A36,#4A111B);
  box-shadow:0 4px 12px rgba(0,0,0,.25), inset 0 0 0 3px #C9A24A, inset 0 0 0 6px #4A111B, inset 0 0 0 7px rgba(201,162,74,.6);
  display:flex;align-items:center;justify-content:center}
.back svg{width:1.6rem;height:2.2rem}
.back.glowL{box-shadow:0 0 18px 4px rgba(233,190,80,.8), inset 0 0 0 3px #C9A24A, inset 0 0 0 6px #4A111B}
.back.glowTR{box-shadow:0 0 16px 3px rgba(150,100,220,.7), inset 0 0 0 3px #C9A24A, inset 0 0 0 6px #4A111B}
.flip{animation:flip .45s ease both}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:rotateY(0)}}
.pop{animation:pop .35s ease both}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.flip,.pop,.pack.shake,.pack::before,.card::after{animation:none!important}}
.bigcard{width:11rem;margin:0 auto 1rem}
.bigcard .card{cursor:default}
.bigcard .card .nm{font-size:1rem}
.bigcard .card .sub,.bigcard .card .foot{font-size:.85rem}
.bigcard .card .emb{font-size:4rem}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
@media (min-width:560px){.grid{grid-template-columns:repeat(4,1fr)}}
.filters{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.chip{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:.3rem .8rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:env(safe-area-inset-top,0px) 0 0}
.sheet{background:var(--surface);width:100%;max-width:40rem;border-radius:20px 20px 0 0;padding:1.4rem 1.3rem calc(1.4rem + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.sheet h2{font-family:Cinzel,serif;font-size:1.35rem;margin:.2rem 0 .3rem}
.sheet .meta{color:var(--muted);font-size:.98rem;margin-bottom:.8rem}
.sheet .quote{font-style:italic;border-left:3px solid var(--accent);padding-left:.8rem;margin:1rem 0}
.vtab{display:grid;grid-template-columns:1fr 1fr;gap:.2rem 1rem;margin:.6rem 0 .8rem;font-size:.95rem}
.vrow{display:flex;justify-content:space-between;gap:.5rem}
.vd{color:var(--accent);letter-spacing:.05em}
.vd .off{color:var(--line)}
.dmg{position:absolute;bottom:-.45rem;right:-.3rem;z-index:2;background:var(--accent);color:var(--accent-ink);font-size:.68rem;font-weight:700;border-radius:999px;padding:.1rem .45rem;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.tagrow{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0}
.tag{font-size:.85rem;border:1px solid var(--line);border-radius:999px;padding:.15rem .6rem}
/* Combat */
.boss{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.1rem;text-align:center;margin-bottom:1rem}
.boss h2{font-family:Cinzel,serif;margin:.2rem 0;font-size:1.4rem}
.hp{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin:.8rem 0 .3rem}
.hp span{display:block;height:100%;background:var(--accent);transition:width .4s ease}
.log{min-height:1.5em;margin:.6rem 0;font-style:italic}
.fighters{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.card.used{opacity:.35;cursor:default}
.card .bonus{position:absolute;top:-.45rem;left:-.3rem;z-index:2;background:#3E8A6A;color:#fff;font-size:.7rem;font-weight:700;border-radius:999px;padding:.1rem .45rem;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.team{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin:.8rem 0}
.slot{border:2px dashed var(--line);border-radius:12px;aspect-ratio:5/7.4;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.9rem;text-align:center;padding:.3rem}
.card.sel{outline:3px solid var(--accent);outline-offset:2px}
.fighter{position:relative}
.fighter .card{cursor:default}
.fighter.active .card{outline:3px solid #E9C46A;outline-offset:2px}
.fighter.ko .card{filter:grayscale(1);opacity:.4}
.pv{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:.35rem}
.pv span{display:block;height:100%;background:#3E8A6A;transition:width .3s}
.pvt{font-size:.8rem;color:var(--muted);text-align:center}
.actions{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;margin:.8rem 0}
.actions .btn{padding:.6rem 1.1rem}
.blog{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.6rem .8rem;font-size:.95rem;min-height:5.5em}
.blog p{margin:.15rem 0}
.blog .eff{color:#3E8A6A;font-weight:600}
.blog .bad{color:#A0503C}
.pickgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
@media (min-width:560px){.pickgrid{grid-template-columns:repeat(4,1fr)}}
.center{text-align:center}
nav button{position:relative}
.dot{position:absolute;top:.45rem;right:18%;width:.55rem;height:.55rem;border-radius:50%;background:var(--accent)}
.blessed{margin-top:.6rem;background:linear-gradient(135deg,#E9C46A,#B8862F);border-color:#B8862F;color:#3A1A10}
.defi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-bottom:.7rem}
.defi .dt{font-weight:600}
.defi .dr{color:var(--muted);font-size:.95rem}
.defi .bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:.5rem 0 .4rem}
.defi .bar span{display:block;height:100%;background:#3E8A6A;transition:width .3s}
.defi .row{display:flex;justify-content:space-between;align-items:center;gap:.6rem}
.defi .btn{padding:.45rem 1rem;font-size:.95rem}
.defi.claimed{opacity:.6}
.defi.bonus{border-color:#C9A24A;box-shadow:inset 0 0 0 1px #C9A24A}
.subtabs{display:flex;gap:.5rem;justify-content:center;margin-bottom:1rem}
.subtabs .chip{font-size:1rem;padding:.4rem 1.2rem}
.ach{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.85rem 1rem;margin-bottom:.7rem;display:flex;gap:.8rem;align-items:center}
.ach .ic{flex:0 0 2.6rem;height:2.6rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Cinzel,serif;font-weight:700;color:#FFF3D0;
  background:radial-gradient(circle at 35% 30%,#8B8F99,#5A5E68)}
.ach.ok .ic{background:radial-gradient(circle at 35% 30%,#E9C46A,#A67C1F)}
.ach .bd{flex:1;min-width:0}
.ach .at{font-weight:600}
.ach .ad{color:var(--muted);font-size:.93rem}
.ach .bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin:.4rem 0 .2rem}
.ach .bar span{display:block;height:100%;background:#B8862F}
.ach .ar{color:var(--muted);font-size:.88rem}
.ach .btn{padding:.4rem .9rem;font-size:.9rem}
.ach.claimed{opacity:.7}
.achhead{text-align:center;color:var(--muted);margin-bottom:.8rem}
.card .new.grace{background:#B8862F}
.card .new.relb{background:linear-gradient(135deg,#F4D27A,#B8862F);color:#3A1A10}
.card .relm{position:absolute;top:.45rem;right:.5rem;z-index:2;width:1.35rem;height:1.35rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;
  background:radial-gradient(circle at 35% 30%,#F4D27A,#A67C1F);color:#5E1622;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.relbox{border:1px solid #C9A24A;border-radius:14px;padding:.8rem 1rem;margin:1rem 0;background:color-mix(in srgb,#F4D27A 12%,var(--surface))}
.relbox .rt{font-weight:600}
.relbox .rd{color:var(--muted);font-size:.95rem;margin:.2rem 0 .5rem}
.grhead{text-align:center;margin-bottom:.4rem}
.grn{font-family:Cinzel,serif;font-size:2rem;font-weight:700;color:#B8862F}
.cloud{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-top:1.4rem;text-align:center}
.cloud .ct{font-weight:600}
.cloud .cs{color:var(--muted);font-size:.93rem;margin:.2rem 0 .6rem}
.cloud .btn{padding:.5rem 1.1rem;font-size:.95rem}
.cloud .gbtn{background:#fff;color:#1F1F1F;border-color:#DADCE0}
.topr{display:flex;align-items:center;gap:.5rem}
.snd{font:inherit;font-size:1.05rem;background:var(--surface);border:1px solid var(--line);border-radius:50%;width:2.2rem;height:2.2rem;cursor:pointer;line-height:1}

/* ---- Animations ---- */
.card{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease;will-change:transform}
.card.tilting{transition:transform .05s linear}
.card .sheen{position:absolute;inset:0;border-radius:12px;pointer-events:none;z-index:1;opacity:var(--so,0);transition:opacity .3s;mix-blend-mode:overlay;
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.75),transparent 45%),
  linear-gradient(115deg,transparent 20%,rgba(255,120,220,.25) 35%,rgba(120,220,255,.25) 50%,rgba(255,240,140,.25) 65%,transparent 80%);background-size:100% 100%,220% 220%;background-position:0 0,var(--mx,50%) var(--my,50%)}
.card.locked .sheen{display:none}
/* ouverture du paquet */
.pack{isolation:isolate}
.burst{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:6}
.burst::before{content:"";position:absolute;left:-60vmax;top:-60vmax;width:120vmax;height:120vmax;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(255,230,160,.55) 0 5deg,transparent 5deg 15deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 60%);mask:radial-gradient(circle,#000 0,transparent 60%);
  animation:burstRays 1s ease-out forwards}
.burst::after{content:"";position:absolute;left:-40px;top:-40px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,#FFF7DA,rgba(255,220,130,.6) 40%,transparent 70%);animation:burstCore .9s ease-out forwards}
@keyframes burstRays{0%{transform:scale(.1) rotate(0);opacity:0}25%{opacity:1}100%{transform:scale(1) rotate(35deg);opacity:0}}
@keyframes burstCore{0%{transform:scale(.2);opacity:1}60%{opacity:1}100%{transform:scale(7);opacity:0}}
.pack.opening .seal{animation:sealBreak .55s ease-in forwards}
@keyframes sealBreak{0%{transform:scale(1)}35%{transform:scale(1.18) rotate(-6deg)}100%{transform:scale(1.6) rotate(12deg);opacity:0;filter:blur(2px)}}
.pack.opening{animation:packLift .9s ease forwards}
@keyframes packLift{0%{transform:none}30%{transform:translateY(-6px) scale(1.03)}100%{transform:none}}
.back.flyin{animation:flyIn .6s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes flyIn{0%{transform:translateY(-220px) scale(.4) rotate(var(--fr,0deg));opacity:0}70%{opacity:1}100%{transform:none;opacity:1}}
/* révélation Très rare */
.trburst{position:absolute;inset:-18px;border-radius:20px;pointer-events:none;z-index:3;box-shadow:0 0 0 0 rgba(170,120,230,.9);animation:trPulse 1s ease-out forwards}
@keyframes trPulse{0%{box-shadow:0 0 0 0 rgba(170,120,230,.9)}100%{box-shadow:0 0 0 28px rgba(170,120,230,0)}}
/* révélation Légendaire */
.legend{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;background:rgba(8,6,4,.86);animation:fadeIn .4s ease both;overflow:hidden;cursor:pointer}
.legend .rays{position:absolute;left:50%;top:45%;width:160vmax;height:160vmax;margin:-80vmax 0 0 -80vmax;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(255,215,120,.22) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%);animation:spin 18s linear infinite}
.legend .halo{position:absolute;left:50%;top:45%;width:24rem;height:24rem;margin:-12rem 0 0 -12rem;border-radius:50%;background:radial-gradient(circle,rgba(255,225,150,.55),transparent 65%);animation:breathe 2.4s ease-in-out infinite}
.legend .lc{position:relative;width:min(58vw,15rem);animation:legIn 1.1s cubic-bezier(.2,.9,.25,1.15) both}
.legend .lc .card{cursor:default}
.legend .lt{position:relative;font-family:Cinzel,serif;font-weight:700;letter-spacing:.35em;color:#F3D27A;font-size:1.3rem;text-shadow:0 0 18px rgba(255,210,110,.7);animation:fadeIn .8s .6s both}
.legend .lh{position:relative;color:#E9DCC0;font-style:italic;font-size:.95rem;animation:fadeIn .6s 1.4s both}
.legend .spark{position:absolute;top:-10px;width:6px;height:6px;border-radius:50%;background:radial-gradient(circle,#FFF4C8,#E0B048 60%,transparent 70%);animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx,0),110vh) rotate(360deg);opacity:.2}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(.92);opacity:.8}50%{transform:scale(1.08);opacity:1}}
@keyframes legIn{0%{transform:scale(.2) rotateY(540deg);opacity:0;filter:brightness(3)}60%{opacity:1}100%{transform:none;filter:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
/* combat : le nuage du vice */
.boss{position:relative;overflow:hidden}
.vcloud{position:relative;width:9rem;height:5.5rem;margin:.4rem auto .2rem;transition:opacity 1.2s ease,transform 1.2s ease,filter 1.2s ease}
.vcloud i{position:absolute;border-radius:50%;background:radial-gradient(circle at 40% 35%,#5B4F66,#2A2230 60%,#15101A);box-shadow:0 0 18px rgba(20,10,30,.5);animation:drift 5s ease-in-out infinite}
.vcloud i:nth-child(1){width:4.4rem;height:4.4rem;left:.4rem;top:1rem}
.vcloud i:nth-child(2){width:5.2rem;height:5.2rem;left:2.4rem;top:0;animation-delay:-1.5s}
.vcloud i:nth-child(3){width:4rem;height:4rem;left:4.8rem;top:1.3rem;animation-delay:-3s}
.vcloud b{position:absolute;left:50%;top:55%;width:2.6rem;height:.9rem;margin-left:-1.3rem;display:flex;justify-content:space-between;z-index:2}
.vcloud b::before,.vcloud b::after{content:"";width:.7rem;height:.45rem;border-radius:50% 50% 0 0;background:#C0392B;box-shadow:0 0 8px #E74C3C;transform:skewX(-10deg)}
.vcloud b::after{transform:skewX(10deg)}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-4px)}}
.vcloud.hit{animation:hit .45s ease}
@keyframes hit{0%,100%{transform:none;filter:none}20%{transform:translateX(-8px);filter:brightness(2.2)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.vcloud.gone{opacity:0;transform:scale(1.8);filter:blur(10px) brightness(3)}
.vlight{position:absolute;left:50%;top:5.2rem;width:10rem;height:10rem;margin:-5rem 0 0 -5rem;border-radius:50%;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(255,236,170,.9),rgba(255,220,130,.25) 45%,transparent 70%);transition:opacity 1.4s ease .3s}
.vlight.on{opacity:1;animation:breathe 3s ease-in-out infinite}
.dmgfly{position:absolute;left:50%;top:3.5rem;transform:translateX(-50%);font-family:Cinzel,serif;font-weight:700;font-size:1.6rem;color:#C0392B;text-shadow:0 2px 0 #fff,0 0 12px rgba(255,255,255,.8);pointer-events:none;z-index:3;animation:dmgUp 1.1s ease-out forwards}
.dmgfly.super{color:#1E8E5A;font-size:2rem}
@keyframes dmgUp{0%{transform:translate(-50%,10px) scale(.6);opacity:0}20%{transform:translate(-50%,-6px) scale(1.2);opacity:1}100%{transform:translate(-50%,-60px) scale(1);opacity:0}}
/* bannière de succès */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + .9rem);z-index:50;transform:translate(-50%,160%);display:flex;align-items:center;gap:.7rem;
  background:linear-gradient(135deg,#FFF4D2,#F1D58A);color:#3A2508;border:1px solid #C9A24A;border-radius:14px;padding:.6rem 1rem;box-shadow:0 10px 26px rgba(0,0,0,.25);max-width:92vw;cursor:pointer;transition:transform .45s cubic-bezier(.2,.9,.3,1.15)}
.toast.show{transform:translate(-50%,0)}
.toast .ti{flex:0 0 2.2rem;height:2.2rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Cinzel,serif;font-weight:700;color:#FFF3D0;background:radial-gradient(circle at 35% 30%,#E9C46A,#A67C1F)}
.toast .tk{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.toast .tt{font-weight:600}
@media (prefers-reduced-motion: reduce){.burst,.legend .rays,.legend .halo,.legend .spark,.vcloud i,.dmgfly,.back.flyin,.pack.opening,.pack.opening .seal,.legend .lc{animation:none!important}.card{transition:none}}


/* neuvaine */
.novena{border-radius:16px;padding:1rem;margin-bottom:.6rem;text-align:center;color:#EDE6FA;background:radial-gradient(ellipse at 50% 0%,#5B3E8C 0%,#2E1E4F 70%);box-shadow:inset 0 0 0 2px #B9A2E8}
.novena .nk{font-size:.9rem;font-style:italic;opacity:.9}
.novena .nn{font-family:Cinzel,serif;font-weight:700;font-size:1.15rem;margin:.2rem 0}
.novena .np{font-style:italic;font-size:.95rem;margin:.3rem 0 .6rem;opacity:.95}
.beads{display:flex;justify-content:center;gap:.35rem;margin:.5rem 0}
.bead{width:1.15rem;height:1.15rem;border-radius:50%;border:2px solid rgba(237,230,250,.55);background:transparent}
.bead.on{background:radial-gradient(circle at 35% 30%,#FFF1C2,#D9A93E);border-color:#F4D27A;box-shadow:0 0 8px rgba(244,210,122,.7)}
.bead.today{outline:2px dashed #F4D27A;outline-offset:2px}
.novena .btn{background:#F4D27A;border-color:#F4D27A;color:#2E1E4F}
.novena .btn:disabled{background:transparent;color:#EDE6FA;border-color:rgba(237,230,250,.45)}
.novena.quiet{background:var(--surface);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
/* pensée du jour */
.thoughtlink{display:block;margin:0 auto .6rem;font:inherit;font-size:.95rem;background:none;border:none;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.thought{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;padding:1.2rem;background:rgba(10,8,6,.6);animation:fadeIn .35s ease both}
.thought .tp{max-width:26rem;width:100%;border-radius:18px;padding:1.6rem 1.4rem;text-align:center;color:#2A2016;
  background:radial-gradient(ellipse at 50% 0%,#FFF9EC,#F1E3C3 70%,#E6D2A6);box-shadow:0 20px 50px rgba(0,0,0,.35),inset 0 0 0 2px #C9A24A,inset 0 0 0 6px #F7EDD5,inset 0 0 0 7px rgba(201,162,74,.6);animation:legIn .7s cubic-bezier(.2,.9,.25,1.1) both}
.thought .tk{font-family:Cinzel,serif;letter-spacing:.2em;font-size:.8rem;color:#8A6A2E}
.thought .tq{font-size:1.3rem;font-style:italic;line-height:1.4;margin:1rem 0}
.thought .tsrc{color:#6B5A40;font-size:.95rem;margin:-.5rem 0 1rem;font-style:italic}
.thought .tsrc:empty{display:none}
.thought .tn{font-family:Cinzel,serif;font-weight:700}
.thought .tf{color:#6B5A40;font-size:.9rem;margin:.2rem 0 1.1rem}
.thought .tpr{font-style:italic;color:#6B5A40;margin-bottom:1rem}
/* album */
.months{display:flex;flex-wrap:wrap;justify-content:center;gap:.3rem;margin:.2rem 0 .8rem}
.months .chip{font-size:.85rem;padding:.25rem .6rem}
.alnav{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.4rem}
.alnav .iconbtn{font:inherit;width:2.6rem;height:2.6rem;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.3rem;cursor:pointer}
.alpage{border-radius:18px;padding:1rem .8rem 1.2rem;background:linear-gradient(180deg,color-mix(in srgb,#F4E8CF 45%,var(--surface)),var(--surface));box-shadow:inset 0 0 0 1px var(--line)}
.alpage h3{font-family:Cinzel,serif;text-align:center;margin:.2rem 0 .1rem;font-size:1.2rem}
.alpage .ald{text-align:center;color:var(--muted);font-size:.95rem;margin-bottom:.8rem}
.albar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin:0 auto .9rem;max-width:16rem}
.albar span{display:block;height:100%;background:#B8862F}
.algrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem}
@media (min-width:560px){.algrid{grid-template-columns:repeat(4,1fr)}}
.slot2{aspect-ratio:5/7.4;border-radius:12px;border:2px dashed color-mix(in srgb,var(--muted) 45%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;padding:.4rem;text-align:center;color:var(--muted);background:color-mix(in srgb,var(--bg) 70%,transparent)}
.slot2 .no{font-family:Cinzel,serif;font-size:1.3rem;opacity:.7}
.slot2 .sn{font-size:.78rem;line-height:1.15}
.alcomplete{text-align:center;font-family:Cinzel,serif;color:#B8862F;margin-top:1rem;letter-spacing:.08em}
.aldots{display:flex;flex-wrap:wrap;justify-content:center;gap:.35rem;margin-top:1rem}
.aldots button{width:.7rem;height:.7rem;border-radius:50%;border:none;padding:0;background:var(--line);cursor:pointer}
.aldots button.cur{background:var(--accent)}
.aldots button.full{box-shadow:0 0 0 2px #B8862F}


/* ---- nettoyage : événements compacts, aide, recherche ---- */
.events{margin-top:1.4rem}
.evh{font-family:Cinzel,serif;font-size:1rem;margin:0 0 .6rem;color:var(--muted);letter-spacing:.06em}
.ev{display:flex;align-items:center;gap:.75rem;border-radius:14px;padding:.7rem .8rem;margin-bottom:.55rem;background:var(--surface);border:1px solid var(--line)}
.ev .evi{flex:0 0 2.4rem;height:2.4rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Cinzel,serif;font-weight:700;color:#FFF3D0;font-size:1.05rem}
.ev .evt{flex:1;min-width:0}
.ev .evn{font-weight:600;line-height:1.2}
.ev .evd{color:var(--muted);font-size:.9rem;line-height:1.25;margin-top:.1rem}
.ev .evb{flex:0 0 auto;font:inherit;font-size:.9rem;font-weight:600;border-radius:999px;padding:.45rem .9rem;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.ev .evb:disabled{background:transparent;color:var(--muted);border-color:var(--line);cursor:default}
.ev.g .evi{background:radial-gradient(circle at 35% 30%,#F4D27A,#A67C1F)}
.ev.f .evi{background:radial-gradient(circle at 35% 30%,#B13A4A,#5E1622)}
.ev.n .evi{background:radial-gradient(circle at 35% 30%,#8B6BC4,#3A2766)}
.ev.g{border-color:#C9A24A}
.ev .mini{display:flex;gap:2px;margin-top:.3rem}
.ev .mini i{width:.5rem;height:.5rem;border-radius:50%;border:1px solid #8B6BC4}
.ev .mini i.on{background:#D9A93E;border-color:#D9A93E}
.ev.d .evi{background:var(--bg);color:var(--ink);border:1px solid var(--line);font-family:inherit;font-size:.8rem;font-weight:700}
.ev.d.claimed{opacity:.6}
.ev.d.claimed .evi{background:#3E8A6A;color:#fff;border-color:#3E8A6A}
.ev.bonusd .evi{background:radial-gradient(circle at 35% 30%,#F4D27A,#A67C1F);color:#FFF3D0;border:none}
.minibar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:.35rem}
.minibar span{display:block;height:100%;background:#3E8A6A}
.oddslink{display:block;margin:.5rem auto 0;font:inherit;font-size:.9rem;background:none;border:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
table.odds{width:100%;border-collapse:collapse;margin:.4rem 0 1rem}
table.odds td{padding:.35rem .2rem;border-bottom:1px solid var(--line)}
table.odds td.r{text-align:right;font-weight:600}
table.odds td.m{text-align:right;color:var(--muted);font-size:.9rem}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.7rem 0;border-bottom:1px solid var(--line)}
.setrow .sl{font-weight:600}
.setrow .sd{color:var(--muted);font-size:.9rem}
.setrow .btn{flex:0 0 auto;padding:.45rem 1rem;font-size:.9rem}
.btn.danger{background:#A0302C;border-color:#A0302C;color:#fff}
.claimall{display:block;margin:0 auto .9rem}
.card .patb{position:absolute;bottom:-.45rem;left:-.3rem;z-index:2;background:#8A2A36;color:#fff;font-size:.62rem;font-weight:700;border-radius:999px;padding:.1rem .45rem;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.plist{max-height:50vh;overflow:auto;margin:.6rem 0;border:1px solid var(--line);border-radius:12px}
.plist button{display:block;width:100%;text-align:left;font:inherit;background:none;border:none;border-bottom:1px solid var(--line);padding:.55rem .8rem;color:var(--ink);cursor:pointer}
.plist button.cur{background:color-mix(in srgb,var(--accent) 15%,transparent);font-weight:600}
.evq{color:var(--muted);font-size:.9rem;text-align:center;margin:.3rem 0}
.credit{color:var(--muted);font-size:.8rem;text-align:center;margin-top:2rem;opacity:.8}
.albar2{display:flex;gap:.5rem;align-items:center;margin-bottom:.8rem}
.albar2 input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.5rem .9rem}
.albar2 input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grbadge{flex:0 0 auto;font-weight:600;color:#B8862F;white-space:nowrap}
.slot2{cursor:pointer;font:inherit}
.slot2 .cost{font-size:.72rem;color:#B8862F}
/* aide */
.intro{position:fixed;inset:0;z-index:46;display:flex;align-items:center;justify-content:center;padding:1rem;background:rgba(10,8,6,.65);animation:fadeIn .3s ease both}
.intro .ib{width:100%;max-width:25rem;background:var(--surface);border-radius:20px;padding:1.6rem 1.3rem 1.2rem;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.intro .ii{width:4rem;height:4rem;margin:0 auto .8rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.8rem;color:#FFF3D0;background:radial-gradient(circle at 35% 30%,#B13A4A,#5E1622);font-family:Cinzel,serif}
.intro h2{font-family:Cinzel,serif;font-size:1.3rem;margin:0 0 .6rem}
.intro .ip{color:var(--ink);margin:0 0 .5rem;line-height:1.45}
.intro .ip small{color:var(--muted)}
.intro .idots{display:flex;justify-content:center;gap:.4rem;margin:1rem 0}
.intro .idots i{width:.55rem;height:.55rem;border-radius:50%;background:var(--line)}
.intro .idots i.on{background:var(--accent)}
.intro .irow{display:flex;justify-content:space-between;gap:.6rem}

.done{text-align:center;font-family:Cinzel,serif;color:var(--l);margin:1rem 0}
.rules summary{cursor:pointer;font-weight:600;margin-top:2rem}
.rules{color:var(--muted)}
.rules p{margin:.5rem 0}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Sancti</h1>
    <div class="topr"><div class="progress" id="progress"></div><button class="snd" id="thoughtBtn" aria-label="Pensée du jour">📜</button><button class="snd" id="helpBtn" aria-label="Comment jouer">?</button><button class="snd" id="setBtn" aria-label="Réglages">⚙</button></div>
  </div>
  <nav role="tablist">
    <button role="tab" data-tab="packs" aria-selected="true">Paquets<span class="dot hidden" id="defiDot"></span></button>
    <button role="tab" data-tab="collection" aria-selected="false">Collection<span class="dot hidden" id="achDot"></span></button>
    <button role="tab" data-tab="combat" aria-selected="false">Combat</button>
  </nav>
</header>

<main>
  <!-- PAQUETS -->
  <section id="tab-packs">
    <div class="packzone">
      <button class="pack" id="packBtn" aria-label="Ouvrir un paquet">
        <span class="orn">✦ ✦ ✦</span>
        <span class="t">SANCTI</span>
        <span class="seal"><svg viewBox="0 0 22 30" aria-hidden="true"><path d="M9 0h4v8h9v4h-9v18H9V12H0V8h9z" fill="currentColor"/></svg></span>
        <span class="s">Touche pour ouvrir</span>
        <span class="orn">✦ ✦ ✦</span>
      </button>
      <div class="count" id="packCount"></div>
      <div class="timer" id="packTimer"></div>
      <button class="btn blessed hidden" id="blessedBtn"></button>
      <button class="oddslink" id="oddsLink">Voir les chances</button>
    </div>
    <div class="reveal" id="reveal"></div>
    <p class="revealhint" id="revealHint"></p>
    <div class="events" id="events"></div>
    <div class="cloud hidden" id="cloudBox"></div>
    <p class="credit">Images : Wikipédia / Wikimedia Commons. La rareté est un choix de jeu, pas un classement de sainteté : tous les saints sont au Ciel !</p>

  <!-- COLLECTION -->
  <section id="tab-collection" class="hidden">
    <div class="subtabs"><button class="chip" id="subAl" aria-pressed="true">Album</button><button class="chip" id="subAch" aria-pressed="false">Succès</button></div>
    <div id="alList"></div>
    <div id="achList" class="hidden"></div>

  <!-- COMBAT -->
  <section id="tab-combat" class="hidden">
    <div class="boss">
      <div class="muted">Vice du jour</div>
      <div class="vlight" id="vLight"></div>
      <div class="vcloud" id="vCloud" aria-hidden="true"><i></i><i></i><i></i><b></b></div>
      <h2 id="bossName"></h2>
      <div class="muted" id="bossCounter"></div>
      <div class="hp"><span id="hpBar"></span></div>
      <div id="hpText" class="muted"></div>
    </div>
    <div id="combatArea"></div>
  </section>
</main>

<div class="modal hidden" id="modal" role="dialog" aria-modal="true">
  <div class="sheet" id="sheet"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>
/* ------------ DONNÉES ------------ */
const RAR = {C:{n:"Commune",w:42,dmg:10},PC:{n:"Peu commune",w:31,dmg:15},R:{n:"Rare",w:19,dmg:25},TR:{n:"Très rare",w:7.5,dmg:40},L:{n:"Légendaire",w:0.5,dmg:60}};
const RORDER=["L","TR","R","PC","C"];
const VICES=[ // index = jour de la semaine (0 = dimanche)
  {v:"Orgueil",c:"Humilité"},{v:"Paresse",c:"Zèle"},{v:"Colère",c:"Douceur"},{v:"Envie",c:"Charité"},
  {v:"Avarice",c:"Générosité"},{v:"Gourmandise",c:"Tempérance"},{v:"Luxure",c:"Chasteté"}];
const S=[
 {id:"michel",n:"Saint Michel",cat:"Archange",r:"L",vt:"Humilité",f:"29 septembre",p:"Protecteur de l'Église, patron secondaire de la France",l:"Prince de la milice céleste, il a combattu Satan et ses anges (Ap 12). Son nom signifie « Qui est comme Dieu ? ».",q:"Quis ut Deus ?"},
 {id:"joseph",n:"Saint Joseph",cat:"Confesseur",r:"L",vt:"Chasteté",f:"19 mars",p:"Patron de l'Église universelle, des pères, des travailleurs et de la bonne mort",l:"Époux de la Vierge Marie et père nourricier de Jésus, charpentier à Nazareth. L'Évangile ne rapporte aucune de ses paroles.",q:"Ite ad Joseph. — Allez à Joseph (Gn 41, 55)"},
 {id:"pierre",n:"Saint Pierre",cat:"Apôtre",r:"L",vt:"Charité",f:"29 juin",p:"Patron des papes et des pêcheurs",l:"Pêcheur de Galilée choisi par le Christ comme chef des Apôtres. Il L'a renié trois fois, puis est mort crucifié à Rome, la tête en bas selon la tradition.",q:"Seigneur, à qui irions-nous ? Tu as les paroles de la vie éternelle. (Jn 6, 68)"},
 {id:"paul",n:"Saint Paul",cat:"Apôtre",r:"L",vt:"Zèle",f:"30 juin",p:"Patron des missionnaires",l:"Persécuteur des chrétiens converti sur le chemin de Damas, il devint l'Apôtre des nations. Il fut décapité à Rome.",q:"Pour moi, vivre, c'est le Christ. (Ph 1, 21)"},
 {id:"jeanbaptiste",n:"Saint Jean-Baptiste",cat:"Précurseur",r:"L",vt:"Tempérance",f:"24 juin",p:"Patron du Canada français",l:"Le Précurseur, qui baptisa Jésus dans le Jourdain. Il vivait au désert, vêtu de poil de chameau, nourri de sauterelles et de miel sauvage.",q:"Il faut qu'il croisse et que je diminue. (Jn 3, 30)"},
 {id:"augustin",n:"Saint Augustin",cat:"Docteur",r:"TR",vt:"Chasteté",f:"28 août",p:"Patron des théologiens",l:"Après une jeunesse désordonnée, il se convertit grâce aux prières de sa mère, sainte Monique. Évêque d'Hippone, il est l'un des plus grands docteurs de l'Église.",q:"Tu nous as faits pour Toi, Seigneur, et notre cœur est sans repos tant qu'il ne repose en Toi."},
 {id:"thomas",n:"Saint Thomas d'Aquin",cat:"Docteur",r:"TR",vt:"Humilité",f:"7 mars",p:"Patron des étudiants et des universités catholiques",l:"Dominicain surnommé le Docteur angélique, auteur de la Somme théologique et de l'office du Saint-Sacrement.",q:"Non nisi Te, Domine. — Rien que Toi, Seigneur."},
 {id:"jean",n:"Saint Jean",cat:"Apôtre",r:"TR",vt:"Charité",f:"27 décembre",p:"Patron des théologiens",l:"Le disciple que Jésus aimait, seul apôtre au pied de la Croix, où il reçut Marie pour mère. Auteur d'un Évangile, de trois épîtres et de l'Apocalypse.",q:"Dieu est amour. (1 Jn 4, 8)"},
 {id:"dominique",n:"Saint Dominique",cat:"Confesseur",r:"TR",vt:"Zèle",f:"4 août",p:"Patron des astronomes",l:"Fondateur de l'Ordre des Prêcheurs. On disait de lui qu'il ne parlait qu'avec Dieu ou de Dieu. La tradition lui attribue la diffusion du Rosaire.",q:"Contemplari et contemplata aliis tradere. — Devise de l'Ordre"},
 {id:"francois",n:"Saint François d'Assise",cat:"Confesseur",r:"TR",vt:"Générosité",f:"4 octobre",p:"Patron de l'Italie",l:"Fils d'un riche marchand, il renonça à tout pour épouser « Dame Pauvreté ». Il reçut les stigmates sur le mont Alverne.",q:"Deus meus et omnia. — Mon Dieu et mon tout."},
 {id:"therese",n:"Sainte Thérèse de l'Enfant-Jésus",cat:"Vierge",r:"TR",vt:"Humilité",f:"3 octobre",p:"Patronne des missions, patronne secondaire de la France",l:"Carmélite de Lisieux, morte à 24 ans. Sa « petite voie » d'enfance spirituelle a touché le monde entier.",q:"Je veux passer mon Ciel à faire du bien sur la terre."},
 {id:"jeanne",n:"Sainte Jeanne d'Arc",cat:"Vierge",r:"TR",vt:"Zèle",f:"30 mai (propre de France)",p:"Patronne secondaire de la France",l:"Jeune fille de Domrémy appelée par des voix à délivrer la France. Elle fit sacrer Charles VII à Reims, puis mourut sur le bûcher à Rouen, à 19 ans.",q:"Messire Dieu premier servi."},
 {id:"benoit",n:"Saint Benoît",cat:"Abbé",r:"TR",vt:"Zèle",f:"21 mars",p:"Patron de l'Europe",l:"Père du monachisme d'Occident et fondateur du Mont-Cassin. Sa Règle a formé des générations de moines.",q:"Ne rien préférer à l'amour du Christ. (Règle, ch. 4)"},
 {id:"bosco",n:"Saint Jean Bosco",cat:"Confesseur",r:"R",vt:"Douceur",f:"31 janvier",p:"Patron de la jeunesse, des éditeurs et des illusionnistes",l:"Prêtre de Turin, il consacra sa vie aux jeunes abandonnés et fonda les Salésiens. Il les menait à Dieu par la joie.",q:"Da mihi animas, cetera tolle. — Donne-moi des âmes, prends tout le reste."},
 {id:"piex",n:"Saint Pie X",cat:"Pontife",r:"R",vt:"Zèle",f:"3 septembre",p:"Patron des premiers communiants",l:"Pape de 1903 à 1914, il combattit le modernisme et ouvrit la communion aux jeunes enfants.",q:"Instaurare omnia in Christo. — Tout restaurer dans le Christ."},
 {id:"agnes",n:"Sainte Agnès",cat:"Vierge et martyre",r:"R",vt:"Chasteté",f:"21 janvier",p:"Patronne des jeunes filles",l:"Jeune Romaine martyrisée vers 12 ou 13 ans pour être restée fidèle à sa consécration au Christ.",q:""},
 {id:"etienne",n:"Saint Étienne",cat:"Martyr",r:"PC",vt:"Douceur",f:"26 décembre",p:"Patron des diacres",l:"Diacre et premier martyr, lapidé à Jérusalem en priant pour ses bourreaux.",q:"Seigneur, ne leur impute pas ce péché. (Ac 7, 60)"},
 {id:"laurent",n:"Saint Laurent",cat:"Martyr",r:"PC",vt:"Générosité",f:"10 août",p:"Patron des diacres et des cuisiniers",l:"Diacre de Rome martyrisé sur un gril en 258. Sommé de livrer les trésors de l'Église, il présenta les pauvres.",q:"Voici les trésors de l'Église. (selon la tradition)"},
 {id:"martin",n:"Saint Martin",cat:"Pontife",r:"PC",vt:"Générosité",f:"11 novembre",p:"Patron des soldats",l:"Soldat romain qui partagea son manteau avec un pauvre à Amiens, puis évêque de Tours et évangélisateur de la Gaule.",q:""},
 {id:"gregoire",n:"Saint Grégoire le Grand",cat:"Docteur",r:"PC",vt:"Humilité",f:"12 mars",p:"Patron des musiciens et des chantres",l:"Pape de 590 à 604, il envoya des missionnaires en Angleterre. Le chant grégorien porte son nom.",q:"Servus servorum Dei. — Serviteur des serviteurs de Dieu."},
 {id:"vianney",n:"Saint Jean-Marie Vianney",cat:"Confesseur",r:"PC",vt:"Tempérance",f:"8 août",p:"Patron des curés",l:"Curé d'Ars pendant plus de quarante ans, il passait des journées entières au confessionnal.",q:"Le sacerdoce, c'est l'amour du cœur de Jésus."},
 {id:"monique",n:"Sainte Monique",cat:"Sainte femme",r:"PC",vt:"Douceur",f:"4 mai",p:"Patronne des mères",l:"Mère de saint Augustin, elle pria pendant de longues années pour sa conversion, et fut exaucée.",q:""},
 {id:"gonzague",n:"Saint Louis de Gonzague",cat:"Confesseur",r:"PC",vt:"Chasteté",f:"21 juin",p:"Patron de la jeunesse",l:"Fils de prince, il renonça à son héritage pour entrer chez les Jésuites. Il mourut à 23 ans après avoir soigné des malades de la peste.",q:""},
 {id:"cecile",n:"Sainte Cécile",cat:"Vierge et martyre",r:"PC",vt:"Chasteté",f:"22 novembre",p:"Patronne des musiciens",l:"Vierge et martyre romaine. La tradition rapporte qu'elle chantait à Dieu dans son cœur le jour de ses noces.",q:""},
 {id:"fsales",n:"Saint François de Sales",cat:"Docteur",r:"PC",vt:"Douceur",f:"29 janvier",p:"Patron des journalistes et des écrivains",l:"Évêque de Genève, auteur de l'Introduction à la vie dévote. Par sa douceur, il ramena à l'Église une grande partie du Chablais.",q:"On prend plus de mouches avec une cuillerée de miel qu'avec un tonneau de vinaigre."},
 {id:"nicolas",n:"Saint Nicolas",cat:"Pontife",r:"C",vt:"Générosité",f:"6 décembre",p:"Patron des enfants, des marins et de la Lorraine",l:"Évêque de Myre au IVe siècle. Selon la tradition, il donna en secret une dot à trois jeunes filles pauvres.",q:""},
 {id:"remi",n:"Saint Remi",cat:"Pontife",r:"C",vt:"Humilité",f:"1er octobre",p:"Apôtre des Francs",l:"Évêque de Reims, il baptisa Clovis vers 496 et ouvrit la conversion des Francs.",q:"Courbe la tête, fier Sicambre… (selon Grégoire de Tours)"},
 {id:"vincent",n:"Saint Vincent de Paul",cat:"Confesseur",r:"C",vt:"Charité",f:"19 juillet",p:"Patron des œuvres de charité",l:"Prêtre, fondateur des Lazaristes et, avec sainte Louise de Marillac, des Filles de la Charité.",q:""},
 {id:"borromee",n:"Saint Charles Borromée",cat:"Pontife",r:"C",vt:"Tempérance",f:"4 novembre",p:"Patron des séminaires et des catéchistes",l:"Archevêque de Milan, grand artisan de la réforme après le concile de Trente. Il soigna lui-même les malades de la peste.",q:""},
 {id:"gabriel",n:"Saint Gabriel",cat:"Archange",r:"L",vt:"Charité",f:"24 mars",p:"Patron des postes et des télécommunications",l:"Archange de l'Annonciation, envoyé à la Vierge Marie à Nazareth. Il annonça aussi à Zacharie la naissance de Jean-Baptiste.",q:"Ave, gratia plena. — Je vous salue, pleine de grâce (Lc 1, 28)"},
 {id:"raphael",n:"Saint Raphaël",cat:"Archange",r:"L",vt:"Douceur",f:"24 octobre",p:"Patron des voyageurs, des médecins et des malades",l:"Archange du livre de Tobie : il guida le jeune Tobie pendant son voyage et guérit son père aveugle. Son nom signifie « Dieu guérit ».",q:"Je suis Raphaël, l'un des sept anges qui se tiennent devant le Seigneur. (Tb 12, 15)"},
 {id:"jacques",n:"Saint Jacques le Majeur",cat:"Apôtre",r:"R",vt:"Zèle",f:"25 juillet",p:"Patron des pèlerins et de l'Espagne",l:"Fils de Zébédée et frère de saint Jean, premier apôtre martyr, décapité à Jérusalem vers 44. Son tombeau est vénéré à Compostelle.",q:""},
 {id:"andre",n:"Saint André",cat:"Apôtre",r:"R",vt:"Charité",f:"30 novembre",p:"Patron de l'Écosse et des pêcheurs",l:"Frère de saint Pierre, premier appelé des apôtres. Selon la tradition, il fut crucifié à Patras sur une croix en forme de X.",q:"Ô bonne Croix, si longtemps désirée ! (selon la tradition)"},
 {id:"thomasap",n:"Saint Thomas",cat:"Apôtre",r:"PC",vt:"Humilité",f:"21 décembre",p:"Patron des architectes",l:"Apôtre qui douta de la Résurrection avant de reconnaître le Christ en voyant ses plaies. La tradition le fait évangéliser l'Inde.",q:"Mon Seigneur et mon Dieu ! (Jn 20, 28)"},
 {id:"anne",n:"Sainte Anne",cat:"Sainte femme",r:"R",vt:"Douceur",f:"26 juillet",p:"Patronne de la Bretagne et du Québec",l:"Mère de la Vierge Marie et grand-mère de Jésus. Son culte est très vivant en Bretagne, à Sainte-Anne-d'Auray.",q:""},
 {id:"madeleine",n:"Sainte Marie-Madeleine",cat:"Sainte femme",r:"R",vt:"Chasteté",f:"22 juillet",p:"Patronne des pénitents et de l'Ordre dominicain",l:"Délivrée de sept démons par le Christ, elle se tint au pied de la Croix et fut la première témoin de la Résurrection.",q:"Rabbouni ! — Maître ! (Jn 20, 16)"},
 {id:"catherine",n:"Sainte Catherine de Sienne",cat:"Vierge",r:"TR",vt:"Charité",f:"30 avril",p:"Patronne de l'Italie et de l'Europe",l:"Tertiaire dominicaine et mystique, elle œuvra pour le retour du pape d'Avignon à Rome. Docteur de l'Église.",q:"Si vous êtes ce que vous devez être, vous mettrez le feu au monde entier."},
 {id:"cupertino",n:"Saint Joseph de Cupertino",cat:"Confesseur",r:"R",vt:"Humilité",f:"18 septembre",p:"Patron des étudiants en examen et des aviateurs",l:"Franciscain aux études si difficiles que son ordination parut presque miraculeuse. Il est célèbre pour ses extases et ses lévitations.",q:""},
 {id:"scholastique",n:"Sainte Scholastique",cat:"Vierge",r:"PC",vt:"Charité",f:"10 février",p:"Patronne des moniales bénédictines",l:"Sœur de saint Benoît. Selon saint Grégoire, sa prière obtint un violent orage qui retint son frère et prolongea leur dernière conversation.",q:""},
 {id:"claire",n:"Sainte Claire",cat:"Vierge",r:"R",vt:"Générosité",f:"12 août",p:"Patronne de la télévision",l:"Disciple de saint François, fondatrice des Pauvres Dames, les Clarisses. Selon la tradition, elle repoussa des soldats en présentant le Saint-Sacrement.",q:""},
 {id:"jerome",n:"Saint Jérôme",cat:"Docteur",r:"PC",vt:"Tempérance",f:"30 septembre",p:"Patron des traducteurs",l:"Docteur de l'Écriture, il traduisit la Bible en latin : la Vulgate. Il passa ses dernières années à Bethléem.",q:"Ignorer les Écritures, c'est ignorer le Christ."},
 {id:"ambroise",n:"Saint Ambroise",cat:"Docteur",r:"PC",vt:"Générosité",f:"7 décembre",p:"Patron de Milan et des apiculteurs",l:"Gouverneur de Milan acclamé évêque alors qu'il n'était pas encore baptisé. Il baptisa saint Augustin en 387 et fit fondre des vases sacrés pour racheter des captifs.",q:"Ubi Petrus, ibi Ecclesia. — Là où est Pierre, là est l'Église."},
 {id:"athanase",n:"Saint Athanase",cat:"Docteur",r:"R",vt:"Zèle",f:"2 mai",p:"Défenseur de la foi de Nicée",l:"Évêque d'Alexandrie, il défendit la divinité du Christ contre l'arianisme et fut exilé cinq fois.",q:"Dieu s'est fait homme pour que l'homme devienne Dieu."},
 {id:"bernard",n:"Saint Bernard",cat:"Docteur",r:"R",vt:"Charité",f:"20 août",p:"Docteur marial",l:"Abbé cistercien de Clairvaux, grand prédicateur et chantre de la Vierge Marie, surnommé le Docteur « melliflu ».",q:"Regarde l'étoile, invoque Marie."},
 {id:"ignace",n:"Saint Ignace de Loyola",cat:"Confesseur",r:"R",vt:"Zèle",f:"31 juillet",p:"Patron des retraites spirituelles",l:"Soldat blessé à Pampelune, converti en lisant des vies de saints. Fondateur de la Compagnie de Jésus et auteur des Exercices spirituels.",q:"Ad majorem Dei gloriam. — Pour la plus grande gloire de Dieu."},
 {id:"xavier",n:"Saint François Xavier",cat:"Confesseur",r:"PC",vt:"Générosité",f:"3 décembre",p:"Patron des missions",l:"Compagnon de saint Ignace, il évangélisa l'Inde et le Japon, et mourut aux portes de la Chine.",q:""},
 {id:"avila",n:"Sainte Thérèse d'Avila",cat:"Vierge",r:"R",vt:"Douceur",f:"15 octobre",p:"Patronne de l'Espagne",l:"Carmélite espagnole, réformatrice du Carmel et grande mystique. Docteur de l'Église.",q:"Que rien ne te trouble, que rien ne t'effraie : Dieu seul suffit."},
 {id:"jeancroix",n:"Saint Jean de la Croix",cat:"Docteur",r:"PC",vt:"Tempérance",f:"24 novembre",p:"Patron des poètes",l:"Réformateur du Carmel avec sainte Thérèse d'Avila, poète mystique de la « nuit obscure ». Emprisonné, il y composa certains de ses plus beaux poèmes.",q:"Au soir de cette vie, nous serons jugés sur l'amour."},
 {id:"neri",n:"Saint Philippe Néri",cat:"Confesseur",r:"PC",vt:"Humilité",f:"26 mai",p:"Apôtre de Rome",l:"Prêtre à Rome, fondateur de l'Oratoire, connu pour sa joie et son humour.",q:""},
 {id:"piev",n:"Saint Pie V",cat:"Pontife",r:"R",vt:"Tempérance",f:"5 mai",p:"Pape du missel de 1570",l:"Pape dominicain, il promulgua le missel romain de 1570. Après Lépante (1571), il institua la fête de Notre-Dame de la Victoire, devenue Notre-Dame du Rosaire.",q:""},
 {id:"ferrier",n:"Saint Vincent Ferrier",cat:"Confesseur",r:"PC",vt:"Tempérance",f:"5 avril",p:"Patron de Vannes",l:"Dominicain espagnol, prédicateur infatigable à travers l'Europe. Il mourut à Vannes, en Bretagne, en 1419.",q:""},
 {id:"rose",n:"Sainte Rose de Lima",cat:"Vierge",r:"PC",vt:"Chasteté",f:"30 août",p:"Patronne de l'Amérique latine",l:"Tertiaire dominicaine à Lima, première sainte canonisée des Amériques.",q:""},
 {id:"albert",n:"Saint Albert le Grand",cat:"Docteur",r:"PC",vt:"Humilité",f:"15 novembre",p:"Patron des scientifiques",l:"Dominicain, évêque de Ratisbonne, immense savant et maître de saint Thomas d'Aquin.",q:""},
 {id:"louis",n:"Saint Louis",cat:"Confesseur",r:"R",vt:"Générosité",f:"25 août",p:"Roi de France (Louis IX)",l:"Roi de France célèbre pour sa justice et sa charité envers les pauvres. Il fit bâtir la Sainte-Chapelle et mourut près de Tunis en 1270.",q:""},
 {id:"genevieve",n:"Sainte Geneviève",cat:"Vierge",r:"PC",vt:"Tempérance",f:"3 janvier (propre de France)",p:"Patronne de Paris et des gendarmes",l:"Jeune femme consacrée qui, en 451, exhorta les Parisiens à prier plutôt qu'à fuir devant Attila. La ville fut épargnée.",q:""},
 {id:"denis",n:"Saint Denis",cat:"Martyr",r:"C",vt:"Charité",f:"9 octobre",p:"Patron de Paris",l:"Premier évêque de Paris, martyrisé avec Rustique et Éleuthère. Selon la légende, il marcha en portant sa tête jusqu'au lieu de sa sépulture.",q:""},
 {id:"irenee",n:"Saint Irénée",cat:"Pontife",r:"C",vt:"Douceur",f:"28 juin",p:"Patron de Lyon",l:"Évêque de Lyon au IIe siècle, disciple de saint Polycarpe et grand défenseur de la foi contre les hérésies. Son nom signifie « pacifique ».",q:"La gloire de Dieu, c'est l'homme vivant."},
 {id:"leon",n:"Saint Léon le Grand",cat:"Docteur",r:"C",vt:"Humilité",f:"11 avril",p:"Docteur de l'Incarnation",l:"Pape de 440 à 461, il précisa la doctrine des deux natures du Christ et obtint d'Attila qu'il épargne Rome.",q:"Chrétien, reconnais ta dignité."},
 {id:"georges",n:"Saint Georges",cat:"Martyr",r:"C",vt:"Zèle",f:"23 avril",p:"Patron des soldats, des scouts et de l'Angleterre",l:"Soldat martyr. La Légende dorée le montre terrassant un dragon pour délivrer une princesse.",q:""},
 {id:"chrysostome",n:"Saint Jean Chrysostome",cat:"Docteur",r:"C",vt:"Générosité",f:"27 janvier",p:"Patron des prédicateurs",l:"Archevêque de Constantinople, surnommé « Bouche d'or » pour son éloquence. Il mourut en exil.",q:"Gloire à Dieu pour tout ! (ses dernières paroles)"},
 {id:"patrick",n:"Saint Patrick",cat:"Pontife",r:"C",vt:"Zèle",f:"17 mars",p:"Patron de l'Irlande",l:"Apôtre de l'Irlande. Selon la tradition, il expliquait la Sainte Trinité à l'aide d'un trèfle.",q:""},
 {id:"bruno",n:"Saint Bruno",cat:"Confesseur",r:"C",vt:"Tempérance",f:"6 octobre",p:"Patron des Chartreux",l:"Il fonda les Chartreux en 1084, dans le massif de la Chartreuse, près de Grenoble.",q:"Stat crux dum volvitur orbis. — La Croix demeure tandis que le monde tourne."},
 {id:"antoinep",n:"Saint Antoine de Padoue",cat:"Docteur",r:"C",vt:"Douceur",f:"13 juin",p:"Patron des objets perdus",l:"Franciscain né à Lisbonne, prédicateur si puissant qu'on disait que les poissons venaient l'écouter. Docteur de l'Église.",q:""},
 {id:"antoineg",n:"Saint Antoine le Grand",cat:"Abbé",r:"PC",vt:"Chasteté",f:"17 janvier",p:"Patron des moines",l:"Il vendit tous ses biens pour vivre au désert d'Égypte. Père des moines, il est célèbre pour ses combats contre les tentations.",q:""},
 {id:"ignacea",n:"Saint Ignace d'Antioche",cat:"Martyr",r:"PC",vt:"Charité",f:"1er février",p:"Évêque et martyr",l:"Évêque d'Antioche, livré aux bêtes à Rome vers 107. Sur la route de son martyre, il écrivit sept lettres aux Églises.",q:"Je suis le froment de Dieu, moulu par la dent des bêtes pour devenir le pain pur du Christ."},
 {id:"joachim",n:"Saint Joachim",cat:"Confesseur",r:"PC",vt:"Tempérance",f:"16 août",p:"Patron des pères et des grands-pères",l:"Époux de sainte Anne et père de la Vierge Marie. Selon la tradition, il jeûna quarante jours au désert avant la naissance de sa fille.",q:""},
 {id:"damascene",n:"Saint Jean Damascène",cat:"Docteur",r:"C",vt:"Tempérance",f:"27 mars",p:"Défenseur des saintes images",l:"Moine près de Jérusalem au VIIIe siècle, il défendit la vénération des icônes contre l'iconoclasme.",q:""},
 {id:"canisius",n:"Saint Pierre Canisius",cat:"Docteur",r:"C",vt:"Zèle",f:"27 avril",p:"Second apôtre de l'Allemagne",l:"Jésuite, il ramena à la foi une grande partie de l'Allemagne après la Réforme. Ses catéchismes furent lus pendant des siècles.",q:""},
 {id:"bellarmin",n:"Saint Robert Bellarmin",cat:"Docteur",r:"PC",vt:"Humilité",f:"13 mai",p:"Patron des catéchistes",l:"Cardinal jésuite, grand théologien de la réforme catholique et auteur de catéchismes. Il vivait très pauvrement malgré sa charge.",q:""},
 {id:"liguori",n:"Saint Alphonse de Liguori",cat:"Docteur",r:"R",vt:"Douceur",f:"2 août",p:"Patron des confesseurs et des moralistes",l:"Avocat devenu prêtre, fondateur des Rédemptoristes, évêque et grand maître de théologie morale.",q:"Celui qui prie se sauve certainement ; celui qui ne prie pas se damne certainement."},
 {id:"bonaventure",n:"Saint Bonaventure",cat:"Docteur",r:"PC",vt:"Humilité",f:"14 juillet",p:"Docteur séraphique",l:"Franciscain, ministre général de son Ordre, il enseigna à Paris à la même époque que saint Thomas d'Aquin.",q:""},
 {id:"anselme",n:"Saint Anselme",cat:"Docteur",r:"C",vt:"Humilité",f:"21 avril",p:"Père de la scolastique",l:"Moine puis abbé du Bec, en Normandie, avant de devenir archevêque de Cantorbéry.",q:"Fides quaerens intellectum. — La foi qui cherche à comprendre."},
 {id:"basile",n:"Saint Basile le Grand",cat:"Docteur",r:"PC",vt:"Générosité",f:"14 juin",p:"Père des moines d'Orient",l:"Évêque de Césarée en Cappadoce, il fonda pour les pauvres et les malades une véritable cité de la charité.",q:""},
 {id:"nazianze",n:"Saint Grégoire de Nazianze",cat:"Docteur",r:"C",vt:"Douceur",f:"9 mai",p:"Surnommé « le Théologien »",l:"Ami de saint Basile et archevêque de Constantinople, célèbre pour ses discours sur la Sainte Trinité.",q:""},
 {id:"hilaire",n:"Saint Hilaire",cat:"Docteur",r:"C",vt:"Zèle",f:"14 janvier",p:"Patron de Poitiers",l:"Évêque de Poitiers, défenseur de la divinité du Christ contre l'arianisme, et maître de saint Martin.",q:""},
 {id:"cyrille",n:"Saint Cyrille d'Alexandrie",cat:"Docteur",r:"C",vt:"Zèle",f:"9 février",p:"Docteur de l'Incarnation",l:"Patriarche d'Alexandrie, il défendit au concile d'Éphèse, en 431, le titre de Marie, Mère de Dieu.",q:""},
 {id:"kostka",n:"Saint Stanislas Kostka",cat:"Confesseur",r:"C",vt:"Chasteté",f:"13 novembre",p:"Patron de la jeunesse",l:"Jeune noble polonais, il fit à pied le chemin jusqu'à Rome pour entrer chez les Jésuites, et mourut à 17 ans.",q:""},
 {id:"pancrace",n:"Saint Pancrace",cat:"Martyr",r:"C",vt:"Chasteté",f:"12 mai",p:"Jeune martyr romain",l:"Adolescent martyrisé à Rome vers l'âge de 14 ans, sous l'empereur Dioclétien.",q:""},
 {id:"lucie",n:"Sainte Lucie",cat:"Vierge et martyre",r:"PC",vt:"Chasteté",f:"13 décembre",p:"Patronne des aveugles",l:"Vierge et martyre de Syracuse. Son nom évoque la lumière, et sa fête illumine l'Avent.",q:""},
 {id:"agathe",n:"Sainte Agathe",cat:"Vierge et martyre",r:"C",vt:"Chasteté",f:"5 février",p:"Patronne de Catane",l:"Vierge et martyre sicilienne. On l'invoque contre le feu et les éruptions de l'Etna.",q:""},
 {id:"catherinea",n:"Sainte Catherine d'Alexandrie",cat:"Vierge et martyre",r:"PC",vt:"Chasteté",f:"25 novembre",p:"Patronne des philosophes",l:"Jeune chrétienne savante qui, selon la tradition, confondit les philosophes de l'empereur avant d'être martyrisée.",q:""},
 {id:"alacoque",n:"Sainte Marguerite-Marie",cat:"Vierge",r:"R",vt:"Charité",f:"17 octobre",p:"Messagère du Sacré-Cœur",l:"Visitandine à Paray-le-Monial, elle reçut les apparitions du Sacré-Cœur de Jésus.",q:""},
 {id:"eudes",n:"Saint Jean Eudes",cat:"Confesseur",r:"C",vt:"Charité",f:"19 août",p:"Apôtre des Sacrés-Cœurs",l:"Prêtre normand, missionnaire infatigable et fondateur des Eudistes. Il répandit le culte des Cœurs de Jésus et de Marie.",q:""},
 {id:"lasalle",n:"Saint Jean-Baptiste de La Salle",cat:"Confesseur",r:"PC",vt:"Zèle",f:"15 mai",p:"Patron des enseignants",l:"Prêtre de Reims, fondateur des Frères des écoles chrétiennes. Il mourut à Rouen en 1719.",q:""},
 {id:"paule",n:"Saint François de Paule",cat:"Confesseur",r:"C",vt:"Tempérance",f:"2 avril",p:"Patron des gens de mer",l:"Ermite calabrais, fondateur des Minimes, voués à un carême perpétuel. Il mourut en France, près de Tours.",q:""},
 {id:"lellis",n:"Saint Camille de Lellis",cat:"Confesseur",r:"C",vt:"Charité",f:"18 juillet",p:"Patron des malades et des soignants",l:"Ancien soldat converti, il fonda les Camilliens pour servir les malades. Leur habit porte une croix rouge.",q:""},
 {id:"jeandedieu",n:"Saint Jean de Dieu",cat:"Confesseur",r:"C",vt:"Générosité",f:"8 mars",p:"Patron des malades et des hôpitaux",l:"Portugais converti à Grenade, il consacra sa vie aux pauvres malades et fonda les Frères hospitaliers.",q:""},
 {id:"claver",n:"Saint Pierre Claver",cat:"Confesseur",r:"PC",vt:"Générosité",f:"9 septembre",p:"Apôtre des esclaves",l:"Jésuite à Carthagène des Indes, il soigna et évangélisa pendant près de quarante ans les esclaves arrivés d'Afrique. Il se disait « esclave des esclaves pour toujours ».",q:""},
 {id:"addolorata",n:"Saint Gabriel de l'Addolorata",cat:"Confesseur",r:"PC",vt:"Chasteté",f:"27 février",p:"Patron de la jeunesse catholique",l:"Jeune passioniste italien, très dévot à Notre-Dame des Douleurs, mort à 23 ans.",q:""},
 {id:"more",n:"Saint Thomas More",cat:"Martyr",r:"R",vt:"Zèle",f:"9 juillet",p:"Patron des responsables politiques",l:"Chancelier d'Angleterre, il refusa de reconnaître Henri VIII comme chef de l'Église et fut décapité en 1535.",q:"Je meurs bon serviteur du roi, mais de Dieu d'abord."},
 {id:"elisabeth",n:"Sainte Élisabeth de Hongrie",cat:"Sainte femme",r:"PC",vt:"Générosité",f:"19 novembre",p:"Patronne des tertiaires franciscains",l:"Princesse mariée en Thuringe, elle donna ses biens aux pauvres. Selon la légende, le pain qu'elle portait se changea en roses.",q:""},
 {id:"chantal",n:"Sainte Jeanne de Chantal",cat:"Sainte femme",r:"C",vt:"Douceur",f:"21 août",p:"Fondatrice de la Visitation",l:"Veuve et mère de famille, elle fonda avec saint François de Sales l'ordre de la Visitation.",q:""},
 {id:"boniface",n:"Saint Boniface",cat:"Martyr",r:"PC",vt:"Zèle",f:"5 juin",p:"Apôtre de l'Allemagne",l:"Moine anglais, il évangélisa la Germanie et abattit le chêne sacré de Geismar. Il fut martyrisé en Frise en 754.",q:""},
 {id:"norbert",n:"Saint Norbert",cat:"Pontife",r:"C",vt:"Tempérance",f:"6 juin",p:"Fondateur des Prémontrés",l:"Chanoine converti, il fonda l'ordre de Prémontré près de Laon, puis devint archevêque de Magdebourg.",q:""},
 {id:"venceslas",n:"Saint Venceslas",cat:"Martyr",r:"C",vt:"Générosité",f:"28 septembre",p:"Patron de la Bohême",l:"Duc de Bohême connu pour sa charité, assassiné en 935 à l'instigation de son frère.",q:""},
 {id:"matthieu",n:"Saint Matthieu",cat:"Apôtre",r:"R",vt:"Générosité",f:"21 septembre",p:"Patron des banquiers et des comptables",l:"Collecteur d'impôts qui quitta tout pour suivre Jésus. Auteur du premier Évangile.",q:""},
 {id:"luc",n:"Saint Luc",cat:"Évangéliste",r:"PC",vt:"Douceur",f:"18 octobre",p:"Patron des médecins et des peintres",l:"Médecin et compagnon de saint Paul, auteur d'un Évangile et des Actes des Apôtres.",q:""},
 {id:"marc",n:"Saint Marc",cat:"Évangéliste",r:"PC",vt:"Zèle",f:"25 avril",p:"Patron de Venise",l:"Disciple de saint Pierre, auteur du plus court des Évangiles. Son symbole est le lion.",q:""},
 {id:"barnabe",n:"Saint Barnabé",cat:"Apôtre",r:"PC",vt:"Générosité",f:"11 juin",p:"Patron de Chypre",l:"Lévite de Chypre qui vendit son champ pour les apôtres, puis compagnon de saint Paul dans ses premières missions.",q:""},
 {id:"barthelemy",n:"Saint Barthélemy",cat:"Apôtre",r:"C",vt:"Humilité",f:"24 août",p:"Apôtre",l:"Apôtre souvent identifié à Nathanaël. Selon la tradition, il fut martyrisé en Arménie.",q:""},
 {id:"jude",n:"Saint Jude",cat:"Apôtre",r:"C",vt:"Charité",f:"28 octobre",p:"Patron des causes désespérées",l:"Apôtre, appelé aussi Thaddée, auteur d'une épître du Nouveau Testament.",q:""},
 {id:"matthias",n:"Saint Matthias",cat:"Apôtre",r:"C",vt:"Humilité",f:"24 février",p:"Choisi par le sort",l:"Désigné par tirage au sort pour remplacer Judas parmi les Douze (Ac 1, 26).",q:""},
 {id:"polycarpe",n:"Saint Polycarpe",cat:"Martyr",r:"PC",vt:"Charité",f:"26 janvier",p:"Évêque et martyr",l:"Évêque de Smyrne, disciple de saint Jean l'apôtre, brûlé vif vers 155.",q:"Voilà quatre-vingt-six ans que je le sers, et il ne m'a fait aucun mal : comment pourrais-je blasphémer mon Roi qui m'a sauvé ?"},
 {id:"clement",n:"Saint Clément",cat:"Pontife",r:"C",vt:"Douceur",f:"23 novembre",p:"Pape et martyr",l:"Troisième successeur de saint Pierre, auteur d'une célèbre lettre aux Corinthiens. Selon la tradition, il mourut martyr en Crimée.",q:""},
 {id:"sylvestre",n:"Saint Sylvestre",cat:"Pontife",r:"PC",vt:"Humilité",f:"31 décembre",p:"Pape",l:"Pape au temps de Constantin, quand l'Église sortit des persécutions. Sa fête se célèbre le dernier jour de l'année.",q:""},
 {id:"gregoire7",n:"Saint Grégoire VII",cat:"Pontife",r:"PC",vt:"Zèle",f:"25 mai",p:"Pape réformateur",l:"Moine devenu pape, il mena une grande réforme de l'Église et défendit sa liberté face à l'empereur Henri IV. Il mourut en exil à Salerne.",q:"J'ai aimé la justice et haï l'iniquité : c'est pourquoi je meurs en exil."},
 {id:"celestin",n:"Saint Célestin V",cat:"Pontife",r:"PC",vt:"Humilité",f:"19 mai",p:"Pape ermite",l:"Ermite élu pape à plus de quatre-vingts ans, il renonça à la papauté après quelques mois pour retrouver la prière.",q:""},
 {id:"perpetue",n:"Saintes Perpétue et Félicité",cat:"Martyres",r:"R",vt:"Charité",f:"6 mars",p:"Martyres de Carthage",l:"Une jeune mère et sa servante, martyrisées ensemble à Carthage en 203. Perpétue a laissé le récit de sa captivité.",q:""},
 {id:"brigitte",n:"Sainte Brigitte de Suède",cat:"Sainte femme",r:"C",vt:"Tempérance",f:"8 octobre",p:"Patronne de la Suède et de l'Europe",l:"Mère de huit enfants, veuve, fondatrice de l'ordre du Saint-Sauveur et grande mystique.",q:""},
 {id:"gertrude",n:"Sainte Gertrude",cat:"Vierge",r:"PC",vt:"Charité",f:"16 novembre",p:"Mystique du Sacré-Cœur",l:"Moniale d'Helfta, en Allemagne, grande mystique du Cœur de Jésus.",q:""},
 {id:"hedwige",n:"Sainte Hedwige",cat:"Sainte femme",r:"C",vt:"Générosité",f:"16 octobre",p:"Patronne de la Silésie",l:"Duchesse de Silésie et mère de famille, elle vécut dans la pénitence et servit les pauvres.",q:""},
 {id:"margueritee",n:"Sainte Marguerite d'Écosse",cat:"Sainte femme",r:"C",vt:"Générosité",f:"10 juin",p:"Patronne de l'Écosse",l:"Reine d'Écosse et mère de huit enfants, célèbre pour sa charité envers les pauvres.",q:""},
 {id:"francoiser",n:"Sainte Françoise Romaine",cat:"Sainte femme",r:"R",vt:"Douceur",f:"9 mars",p:"Patronne des automobilistes",l:"Épouse et mère à Rome, fondatrice des Oblates. Selon la tradition, elle voyait son ange gardien, qui éclairait sa route la nuit.",q:"Une femme mariée doit parfois quitter Dieu à l'autel pour Le retrouver dans son ménage."},
 {id:"chrysologue",n:"Saint Pierre Chrysologue",cat:"Docteur",r:"C",vt:"Douceur",f:"4 décembre",p:"Surnommé « Parole d'or »",l:"Archevêque de Ravenne au Ve siècle, célèbre pour ses sermons.",q:""},
 {id:"damien",n:"Saint Pierre Damien",cat:"Docteur",r:"C",vt:"Tempérance",f:"23 février",p:"Réformateur",l:"Moine camaldule, cardinal et grand réformateur de l'Église au XIe siècle.",q:""},
 {id:"bede",n:"Saint Bède le Vénérable",cat:"Docteur",r:"PC",vt:"Humilité",f:"27 mai",p:"Patron des historiens",l:"Moine anglais, auteur de la première grande histoire de l'Église d'Angleterre.",q:""},
 {id:"ephrem",n:"Saint Éphrem",cat:"Docteur",r:"PC",vt:"Chasteté",f:"18 juin",p:"Surnommé « la harpe du Saint-Esprit »",l:"Diacre syrien, poète, auteur de très nombreuses hymnes.",q:""},
 {id:"isidore",n:"Saint Isidore de Séville",cat:"Docteur",r:"PC",vt:"Zèle",f:"4 avril",p:"Docteur de l'Église",l:"Évêque de Séville, auteur des Étymologies, une encyclopédie du savoir de son temps.",q:""},
 {id:"cyrillej",n:"Saint Cyrille de Jérusalem",cat:"Docteur",r:"C",vt:"Zèle",f:"18 mars",p:"Catéchiste de Jérusalem",l:"Évêque de Jérusalem, auteur de célèbres catéchèses pour les futurs baptisés.",q:""},
 {id:"josaphat",n:"Saint Josaphat",cat:"Martyr",r:"C",vt:"Douceur",f:"14 novembre",p:"Martyr de l'unité",l:"Archevêque de Polotsk, martyrisé en 1623 pour l'unité des chrétiens avec Rome.",q:""},
 {id:"fidele",n:"Saint Fidèle de Sigmaringen",cat:"Martyr",r:"C",vt:"Zèle",f:"24 avril",p:"Premier martyr des Capucins",l:"Avocat devenu capucin, il fut martyrisé en Suisse en 1622.",q:""},
 {id:"paulerm",n:"Saint Paul ermite",cat:"Confesseur",r:"C",vt:"Tempérance",f:"15 janvier",p:"Premier ermite",l:"Premier ermite chrétien, il vécut près d'un siècle au désert d'Égypte. Selon la tradition, un corbeau lui apportait son pain.",q:""},
 {id:"capistran",n:"Saint Jean de Capistran",cat:"Confesseur",r:"C",vt:"Zèle",f:"28 mars",p:"Patron des aumôniers militaires",l:"Franciscain et grand prédicateur, il anima la défense de Belgrade contre les Ottomans en 1456.",q:""},
 {id:"bernardin",n:"Saint Bernardin de Sienne",cat:"Confesseur",r:"R",vt:"Chasteté",f:"20 mai",p:"Patron des publicitaires",l:"Franciscain et grand prédicateur, il répandit la dévotion au saint Nom de Jésus avec le monogramme IHS.",q:""},
 {id:"raymond",n:"Saint Raymond de Peñafort",cat:"Confesseur",r:"PC",vt:"Humilité",f:"23 janvier",p:"Patron des canonistes",l:"Dominicain, maître général de l'Ordre, il rassembla les lois de l'Église pour le pape Grégoire IX.",q:""},
 {id:"hyacinthe",n:"Saint Hyacinthe",cat:"Confesseur",r:"PC",vt:"Tempérance",f:"17 août",p:"Apôtre de la Pologne",l:"Dominicain polonais, missionnaire infatigable en Pologne et dans les pays du Nord.",q:""},
 {id:"pierremartyr",n:"Saint Pierre de Vérone",cat:"Martyr",r:"R",vt:"Chasteté",f:"29 avril",p:"Martyr dominicain",l:"Dominicain et prédicateur, assassiné en 1252. Selon la tradition, il écrivit « Credo » sur le sol avec son sang.",q:""},
 {id:"antonin",n:"Saint Antonin",cat:"Pontife",r:"C",vt:"Générosité",f:"10 mai",p:"Archevêque de Florence",l:"Dominicain, archevêque de Florence, célèbre pour sa charité et sa simplicité de vie.",q:""},
 {id:"matha",n:"Saint Jean de Matha",cat:"Confesseur",r:"C",vt:"Charité",f:"8 février",p:"Fondateur des Trinitaires",l:"Prêtre provençal, fondateur des Trinitaires pour le rachat des captifs.",q:""},
 {id:"nolasque",n:"Saint Pierre Nolasque",cat:"Confesseur",r:"C",vt:"Charité",f:"28 janvier",p:"Fondateur des Mercédaires",l:"Fondateur de l'ordre de la Merci, voué au rachat des chrétiens captifs.",q:""},
 {id:"gaetan",n:"Saint Gaétan",cat:"Confesseur",r:"C",vt:"Humilité",f:"7 août",p:"Saint de la Providence",l:"Prêtre, fondateur des Théatins, il mettait toute sa confiance dans la Providence.",q:""},
 {id:"emilien",n:"Saint Jérôme Émilien",cat:"Confesseur",r:"C",vt:"Douceur",f:"20 juillet",p:"Patron des orphelins",l:"Ancien soldat vénitien, il consacra sa vie aux enfants orphelins.",q:""},
 {id:"vincentd",n:"Saint Vincent de Saragosse",cat:"Martyr",r:"C",vt:"Chasteté",f:"22 janvier",p:"Patron des vignerons",l:"Diacre de Saragosse, martyrisé en 304.",q:""},
 {id:"blaise",n:"Saint Blaise",cat:"Martyr",r:"C",vt:"Douceur",f:"3 février",p:"Invoqué contre les maux de gorge",l:"Évêque de Sébaste, en Arménie, et martyr. On bénit les gorges le jour de sa fête.",q:""},
 {id:"romain",n:"Saint Romain",cat:"Pontife",r:"PC",vt:"Zèle",f:"23 octobre (propre de Rouen)",p:"Patron de Rouen",l:"Évêque de Rouen au VIIe siècle. Selon la légende, il délivra la ville de la Gargouille, un dragon qui la terrorisait.",q:""},
 {id:"radegonde",n:"Sainte Radegonde",cat:"Sainte femme",r:"PC",vt:"Tempérance",f:"13 août (propre de France)",p:"Patronne de Poitiers",l:"Reine des Francs, épouse de Clotaire Ier, elle quitta la cour pour fonder un monastère à Poitiers.",q:""},
 {id:"elie",n:"Saint Élie",cat:"Prophète",r:"TR",vt:"Zèle",f:"20 juillet (propre du Carmel)",p:"Père spirituel du Carmel",l:"Prophète d'Israël qui défia les prophètes de Baal sur le mont Carmel, puis fut enlevé au ciel sur un char de feu.",q:"Zelo zelatus sum pro Domino Deo exercituum. — Je brûle de zèle pour le Seigneur, Dieu des armées. (1 R 19, 10)"},
 {id:"elisabethjb",n:"Sainte Élisabeth",cat:"Sainte femme",r:"PC",vt:"Humilité",f:"5 novembre (Martyrologe)",p:"Mère de saint Jean-Baptiste",l:"Cousine de la Vierge Marie, elle devint mère de Jean-Baptiste dans sa vieillesse. À la Visitation, elle salua Marie comme la mère de son Seigneur.",q:"Tu es bénie entre toutes les femmes, et le fruit de ton sein est béni. (Lc 1, 42)"},
 {id:"zacharie",n:"Saint Zacharie",cat:"Confesseur",r:"PC",vt:"Tempérance",f:"5 novembre (Martyrologe)",p:"Père de saint Jean-Baptiste",l:"Prêtre du Temple, père de Jean-Baptiste. Resté muet pour avoir douté de l'ange Gabriel, il retrouva la parole en chantant le Benedictus.",q:"Benedictus Dominus Deus Israël. — Béni soit le Seigneur, Dieu d'Israël. (Lc 1, 68)"},
 {id:"marthe",n:"Sainte Marthe",cat:"Sainte femme",r:"R",vt:"Générosité",f:"29 juillet",p:"Patronne des hôteliers et des cuisiniers",l:"Sœur de Marie et de Lazare, elle accueillait Jésus à Béthanie. Selon la tradition provençale, elle vint en Provence et dompta la Tarasque.",q:"Oui, Seigneur, je crois que tu es le Christ, le Fils de Dieu. (Jn 11, 27)"},
 {id:"lazare",n:"Saint Lazare",cat:"Confesseur",r:"R",vt:"Douceur",f:"17 décembre (Martyrologe)",p:"L'ami de Jésus",l:"Frère de Marthe et de Marie, ami de Jésus, qui le ressuscita à Béthanie. Selon la tradition provençale, il devint évêque de Marseille.",q:""},
 {id:"philippe",n:"Saint Philippe",cat:"Apôtre",r:"PC",vt:"Charité",f:"11 mai",p:"Apôtre",l:"Apôtre originaire de Bethsaïde, qui amena Nathanaël à Jésus. À la Cène, il demanda au Christ de leur montrer le Père.",q:"Seigneur, montre-nous le Père, et cela nous suffit. (Jn 14, 8)"},
 {id:"simon",n:"Saint Simon",cat:"Apôtre",r:"C",vt:"Zèle",f:"28 octobre",p:"Apôtre, surnommé le Zélote",l:"Apôtre surnommé le Zélote. Selon la tradition, il évangélisa avec saint Jude et partagea son martyre.",q:""},
 {id:"jacquesmin",n:"Saint Jacques le Mineur",cat:"Apôtre",r:"PC",vt:"Tempérance",f:"11 mai",p:"Premier évêque de Jérusalem",l:"Apôtre appelé « frère du Seigneur », premier évêque de Jérusalem et auteur d'une épître. Il fut martyrisé vers 62.",q:"La foi sans les œuvres est morte. (Jc 2, 26)"},
 {id:"timothee",n:"Saint Timothée",cat:"Pontife",r:"C",vt:"Douceur",f:"24 janvier",p:"Disciple de saint Paul",l:"Disciple et compagnon de saint Paul, qui lui adressa deux lettres. Premier évêque d'Éphèse.",q:""},
 {id:"tite",n:"Saint Tite",cat:"Pontife",r:"C",vt:"Charité",f:"6 février",p:"Évêque de Crète",l:"Disciple de saint Paul, qui lui confia l'Église de Crète et lui adressa une lettre.",q:""},
 {id:"justin",n:"Saint Justin",cat:"Martyr",r:"PC",vt:"Zèle",f:"14 avril",p:"Patron des philosophes",l:"Philosophe converti, il défendit la foi dans ses Apologies et fut martyrisé à Rome vers 165.",q:""},
 {id:"cyprien",n:"Saint Cyprien",cat:"Martyr",r:"PC",vt:"Charité",f:"16 septembre",p:"Évêque de Carthage",l:"Évêque de Carthage, grand défenseur de l'unité de l'Église, décapité en 258.",q:"Nul ne peut avoir Dieu pour Père s'il n'a l'Église pour mère."},
 {id:"leon9",n:"Saint Léon IX",cat:"Pontife",r:"C",vt:"Humilité",f:"19 avril (Martyrologe)",p:"Pape alsacien",l:"Pape né en Alsace, grand réformateur de l'Église au XIe siècle, qui parcourut l'Europe pour la renouveler.",q:""},
 {id:"gregtours",n:"Saint Grégoire de Tours",cat:"Pontife",r:"C",vt:"Douceur",f:"17 novembre (propre de France)",p:"Historien des Francs",l:"Évêque de Tours au VIe siècle, auteur de l'Histoire des Francs, qui raconte notamment le baptême de Clovis.",q:""},
 {id:"isidorel",n:"Saint Isidore le Laboureur",cat:"Confesseur",r:"C",vt:"Humilité",f:"15 mai",p:"Patron des agriculteurs",l:"Paysan de Madrid, pieux et charitable. Selon la légende, des anges labouraient son champ pendant qu'il priait.",q:""},
 {id:"eloi",n:"Saint Éloi",cat:"Pontife",r:"C",vt:"Générosité",f:"1er décembre (propre de France)",p:"Patron des orfèvres et des forgerons",l:"Orfèvre et trésorier du roi Dagobert, puis évêque de Noyon. Il rachetait des captifs avec sa fortune.",q:""},
 {id:"ferdinand",n:"Saint Ferdinand",cat:"Confesseur",r:"C",vt:"Tempérance",f:"30 mai (Martyrologe)",p:"Roi de Castille",l:"Roi de Castille et de León au XIIIe siècle, réputé pour sa justice. La cathédrale de Burgos fut commencée sous son règne.",q:""},
 {id:"edouard",n:"Saint Édouard le Confesseur",cat:"Confesseur",r:"C",vt:"Chasteté",f:"13 octobre",p:"Roi d'Angleterre",l:"Roi d'Angleterre au XIe siècle, bâtisseur de l'abbaye de Westminster.",q:""},
 {id:"casimir",n:"Saint Casimir",cat:"Confesseur",r:"C",vt:"Chasteté",f:"4 mars",p:"Patron de la Lituanie",l:"Prince polonais mort jeune, célèbre pour sa pureté, sa charité et sa dévotion à la Vierge.",q:""},
 {id:"stanislasc",n:"Saint Stanislas de Cracovie",cat:"Martyr",r:"C",vt:"Zèle",f:"7 mai",p:"Patron de la Pologne",l:"Évêque de Cracovie, tué en 1079 pendant qu'il célébrait la messe, sur ordre du roi Boleslas II.",q:""},
 {id:"becket",n:"Saint Thomas Becket",cat:"Martyr",r:"R",vt:"Zèle",f:"29 décembre",p:"Archevêque de Cantorbéry",l:"Chancelier devenu archevêque de Cantorbéry, il défendit la liberté de l'Église contre le roi Henri II et fut assassiné dans sa cathédrale en 1170.",q:""},
 {id:"hildegarde",n:"Sainte Hildegarde",cat:"Vierge",r:"R",vt:"Chasteté",f:"17 septembre (Martyrologe)",p:"Docteur de l'Église depuis 2012",l:"Abbesse bénédictine en Allemagne au XIIe siècle, mystique, compositrice et savante.",q:""},
 {id:"borgia",n:"Saint François de Borgia",cat:"Confesseur",r:"C",vt:"Humilité",f:"10 octobre",p:"Duc devenu jésuite",l:"Duc de Gandie, il renonça à tout après la mort de sa femme pour entrer chez les Jésuites, dont il devint le supérieur général.",q:""},
 {id:"fourier",n:"Saint Pierre Fourier",cat:"Confesseur",r:"C",vt:"Charité",f:"9 décembre (propre de France)",p:"Le bon père de Mattaincourt",l:"Curé de Mattaincourt, en Lorraine, il fonda avec Alix Le Clerc des écoles gratuites pour les filles.",q:""},
 {id:"montfort",n:"Saint Louis-Marie Grignion de Montfort",cat:"Confesseur",r:"R",vt:"Générosité",f:"28 avril",p:"Apôtre de la consécration à Marie",l:"Prêtre breton, missionnaire dans l'ouest de la France, auteur du Traité de la vraie dévotion à la Sainte Vierge.",q:"À Jésus par Marie."},
 {id:"rodriguez",n:"Saint Alphonse Rodriguez",cat:"Confesseur",r:"C",vt:"Humilité",f:"30 octobre",p:"Frère portier",l:"Frère jésuite, portier du collège de Majorque pendant plus de quarante ans. Il fut le conseiller spirituel de saint Pierre Claver.",q:""},
